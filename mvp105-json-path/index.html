<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Path Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 32px; }
    h1 { color: #333; margin-bottom: 24px; text-align: center; }
    .row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 300px; }
    label { display: block; margin-bottom: 6px; color: #555; font-weight: 500; }
    textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: monospace; min-height: 200px; resize: vertical; }
    .field { margin-bottom: 16px; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: monospace; }
    .btn { background: #6f42c1; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    .btn:hover { background: #5a32a3; }
    .help { font-size: 12px; color: #888; margin-top: 4px; }
    #result { background: #f8f9fa; border-radius: 8px; padding: 16px; margin-top: 16px; display: none; }
    #result h3 { color: #6f42c1; margin-bottom: 8px; }
    #result pre { background: #2d2d2d; color: #f8f8f2; padding: 16px; border-radius: 6px; overflow-x: auto; max-height: 300px; }
    .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 6px; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 JSON Path Finder</h1>
    <div class="field">
      <label>Enter JSON:</label>
      <textarea id="jsonInput" placeholder='{"users": [{"name": "John", "age": 30}, {"name": "Jane", "age": 25}]}'></textarea>
    </div>
    <div class="field">
      <label>JSONPath Expression:</label>
      <input type="text" id="pathInput" placeholder="users.0.name or users[*].name">
      <p class="help">Use dot notation: key.subkey or key[index]. Use * for array wildcards.</p>
    </div>
    <button class="btn" onclick="find()">Find Value</button>
    <div id="error" class="error"></div>
    <div id="result">
      <h3>Result:</h3>
      <pre id="resultText"></pre>
    </div>
  </div>
  <script>
    function find() {
      const jsonStr = document.getElementById('jsonInput').value;
      const path = document.getElementById('pathInput').value.trim();
      const result = document.getElementById('result');
      const resultText = document.getElementById('resultText');
      const error = document.getElementById('error');
      
      error.style.display = result.style.display = 'none';
      
      if (!jsonStr || !path) {
        error.textContent = 'Please enter both JSON and path';
        error.style.display = 'block';
        return;
      }

      try {
        const data = JSON.parse(jsonStr);
        const value = evalPath(data, path);
        resultText.textContent = JSON.stringify(value, null, 2);
        result.style.display = 'block';
      } catch (e) {
        error.textContent = 'Error: ' + e.message;
        error.style.display = 'block';
      }
    }

    function evalPath(obj, path) {
      const parts = path.split('.').reduce((acc, part) => {
        if (part.includes('[')) {
          const [key, idx] = part.replace(']', '').split('[');
          if (key) acc.push(key);
          if (idx === '*') acc.push({ wildcard: true });
          else if (idx) acc.push({ index: parseInt(idx) });
        } else if (part === '*') {
          acc.push({ wildcard: true });
        } else if (part) {
          acc.push(part);
        }
        return acc;
      }, []);

      let current = obj;
      for (const part of parts) {
        if (part === undefined) return undefined;
        
        if (typeof part === 'object' && 'wildcard' in part) {
          if (!Array.isArray(current)) throw new Error('Wildcard only works on arrays');
          current = current.map(item => evalPath(item, parts.slice(parts.indexOf(part) + 1).map(p => typeof p === 'string' ? p : (p.index !== undefined ? `[${p.index}]` : '*')).join('.')));
          break;
        } else if (typeof part === 'object' && 'index' in part) {
          current = current[part.index];
        } else {
          current = current[part];
        }
        
        if (current === undefined) throw new Error(`Path not found: ${part}`);
      }
      return current;
    }

    // Also support simple bracket notation
    const orig = evalPath;
    evalPath = (obj, path) => {
      try {
        // Simple bracket notation support: users[0].name or users[*].name
        const bracketPath = path.replace(/(\w+)\[(\d+|\*)\]/g, '[$1.$2]').replace(/\.(\w+)/g, '[$1]');
        // Fall back to simple recursive lookup
        return simpleEval(obj, path);
      } catch { throw new Error('Invalid path'); }
    };

    function simpleEval(obj, path) {
      const parts = path.match(/[^.\[\]]+|\[\d+\]|\[\*\]/g) || [];
      let current = obj;
      for (const part of parts) {
        if (part === '[*]') {
          if (!Array.isArray(current)) throw new Error('Cannot use [*] on non-array');
          return current.map(c => c);
        }
        const match = part.match(/\[(\d+)\]/);
        if (match) {
          const key = current instanceof Array ? parseInt(match[1]) : match[1];
          current = current[key];
        } else {
          current = current[part];
        }
        if (current === undefined) throw new Error(`Path "${part}" not found`);
      }
      return current;
    }
  </script>
</body>
</html>
