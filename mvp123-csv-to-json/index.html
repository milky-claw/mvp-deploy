<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV to JSON</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee; }
    h1 { color: #feca57; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .box { flex: 1; min-width: 300px; }
    textarea { width: 100%; height: 300px; background: #16213e; color: #fff; border: 1px solid #0f3460; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 14px; }
    .buttons { margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap; }
    button { background: #0f3460; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #e94560; }
    button.primary { background: #feca57; color: #1a1a2e; }
    .options { background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .options label { margin-right: 20px; }
    select, input { background: #0f3460; color: #fff; border: 1px solid #fff; padding: 5px 10px; border-radius: 4px; }
    .status { padding: 10px; border-radius: 5px; margin-top: 10px; }
    .status.error { background: #ff4757; }
    .status.success { background: #2ed573; color: #1a1a2e; }
    .info { background: #3742fa; padding: 10px; border-radius: 5px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>📊 CSV to JSON</h1>
  <div class="options">
    <label>First row: <select id="header"><option value="true">Is Header</option><option value="false">No Header</option></select></label>
    <label>Delimiter: <select id="delimiter"><option value=",">Comma (,)</option><option value=";">Semicolon (;)</option><option value="\t">Tab</option></select></label>
  </div>
  <div class="container">
    <div class="box">
      <h3>CSV Input</h3>
      <textarea id="input" placeholder="name,age,city&#10;John,30,NYC&#10;Jane,25,LA"></textarea>
    </div>
    <div class="box">
      <h3>JSON Output</h3>
      <textarea id="output" readonly></textarea>
    </div>
  </div>
  <div class="buttons">
    <button class="primary" onclick="convert()">Convert</button>
    <button onclick="clearAll()">Clear</button>
    <button onclick="copy()">Copy</button>
    <button onclick="download()">Download</button>
  </div>
  <div id="status"></div>
  <div class="info">💡 Tip: First row can be used as keys</div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function showStatus(msg, isError = true) {
      status.textContent = msg;
      status.className = 'status ' + (isError ? 'error' : 'success');
    }

    function convert() {
      try {
        const text = input.value.trim();
        if (!text) {
          showStatus('❌ Please enter CSV data');
          return;
        }

        const hasHeader = document.getElementById('header').value === 'true';
        const delimiter = document.getElementById('delimiter').value;
        
        const rows = text.split('\n').map(r => r.split(delimiter).map(c => c.trim()));
        
        if (rows.length < 2) {
          showStatus('❌ Need at least 2 rows');
          return;
        }

        let keys;
        if (hasHeader) {
          keys = rows[0];
          rows.shift();
        } else {
          keys = rows[0].map((_, i) => 'col' + (i + 1));
        }

        const json = rows.map(row => {
          const obj = {};
          keys.forEach((key, i) => {
            obj[key] = row[i] || '';
          });
          return obj;
        });

        output.value = JSON.stringify(json, null, 2);
        showStatus(`✅ Converted ${json.length} rows`, false);
      } catch (e) {
        showStatus('❌ Error: ' + e.message);
      }
    }

    function clearAll() {
      input.value = '';
      output.value = '';
      status.textContent = '';
    }

    function copy() {
      output.select();
      document.execCommand('copy');
      showStatus('📋 Copied!', false);
    }

    function download() {
      const blob = new Blob([output.value], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.json';
      a.click();
      URL.revokeObjectURL(url);
      showStatus('📥 Downloaded!', false);
    }

    // Expose for tests
    window.csvToJson = {
      convert: (csv, hasHeader = true, delimiter = ',') => {
        const rows = csv.trim().split('\n').map(r => r.split(delimiter).map(c => c.trim()));
        if (rows.length < 2) return [];
        let keys;
        if (hasHeader) {
          keys = rows[0];
          rows.shift();
        } else {
          keys = rows[0].map((_, i) => 'col' + (i + 1));
        }
        return rows.map(row => {
          const obj = {};
          keys.forEach((key, i) => { obj[key] = row[i] || ''; });
          return obj;
        });
      }
    };
  </script>
</body>
</html>
