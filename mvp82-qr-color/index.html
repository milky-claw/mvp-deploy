<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Color Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: #1e293b; padding: 2rem; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #38bdf8; text-align: center; }
    .input-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: #94a3b8; }
    input, textarea { width: 100%; padding: 0.75rem; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1rem; }
    input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    .color-row { display: flex; gap: 1rem; }
    .color-field { flex: 1; }
    input[type="color"] { height: 48px; padding: 4px; cursor: pointer; }
    .preview { margin: 1.5rem 0; text-align: center; padding: 1.5rem; background: #fff; border-radius: 12px; }
    .preview canvas { max-width: 100%; }
    button { width: 100%; padding: 1rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0ea5e9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 QR Code Color Generator</h1>
    <div class="input-group">
      <label>Content (URL or Text)</label>
      <input type="text" id="content" value="https://example.com" placeholder="Enter URL or text">
    </div>
    <div class="color-row">
      <div class="color-field">
        <label>Foreground</label>
        <input type="color" id="fgColor" value="#000000">
      </div>
      <div class="color-field">
        <label>Background</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
    </div>
    <div class="input-group" style="margin-top: 1rem;">
      <label>Size: <span id="sizeVal">256</span>px</label>
      <input type="range" id="size" min="128" max="512" step="64" value="256">
    </div>
    <div class="preview">
      <canvas id="qrCanvas"></canvas>
    </div>
    <button onclick="downloadQR()">Download QR Code</button>
  </div>
  <script>
    const contentEl = document.getElementById('content');
    const fgColorEl = document.getElementById('fgColor');
    const bgColorEl = document.getElementById('bgColor');
    const sizeEl = document.getElementById('size');
    const sizeValEl = document.getElementById('sizeVal');
    const canvas = document.getElementById('qrCanvas');

    function generateQR() {
      const opts = {
        text: contentEl.value || 'https://example.com',
        width: parseInt(sizeEl.value),
        color: { dark: fgColorEl.value, light: bgColorEl.value }
      };
      QRCode.toCanvas(canvas, opts.text, opts, () => {});
    }

    function downloadQR() {
      const link = document.createElement('a');
      link.download = 'qrcode.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    contentEl.addEventListener('input', generateQR);
    fgColorEl.addEventListener('input', generateQR);
    bgColorEl.addEventListener('input', generateQR);
    sizeEl.addEventListener('input', () => { sizeValEl.textContent = sizeEl.value; generateQR(); });
    generateQR();
  </script>
</body>
</html>
