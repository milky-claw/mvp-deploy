<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON ↔ YAML Converter</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a; 
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    h1 { text-align: center; margin-bottom: 30px; color: #38bdf8; }
    .container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; }
    .panel { flex: 1; display: flex; flex-direction: column; }
    label { font-weight: 600; margin-bottom: 8px; color: #94a3b8; }
    textarea {
      flex: 1;
      min-height: 400px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 16px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 13px;
      resize: none;
    }
    textarea:focus { outline: none; border-color: #38bdf8; }
    .actions { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
    button {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0284c7; }
    .error { color: #f87171; text-align: center; margin: 10px 0; font-size: 14px; }
  </style>
</head>
<body>
  <h1>JSON ↔ YAML Converter</h1>
  <div class="container">
    <div class="panel">
      <label>JSON Input</label>
      <textarea id="jsonInput" placeholder='{"name": "test", "value": 123}'></textarea>
    </div>
    <div class="panel">
      <label>YAML Output</label>
      <textarea id="yamlOutput" placeholder="name: test&#10;value: 123"></textarea>
    </div>
  </div>
  <div class="actions">
    <button onclick="jsonToYaml()">JSON → YAML</button>
    <button onclick="yamlToJson()">YAML → JSON</button>
    <button onclick="sample()">Load Sample</button>
    <button onclick="copyOutput()">Copy YAML</button>
  </div>
  <div class="error" id="error"></div>

  <script src="./vendor/js-yaml.min.js"></script>
  <script>
    const jsonInput = document.getElementById('jsonInput');
    const yamlOutput = document.getElementById('yamlOutput');
    const errorDiv = document.getElementById('error');

    function jsonToYaml() {
      errorDiv.textContent = '';
      try {
        const json = JSON.parse(jsonInput.value);
        const yaml = jsyaml.dump(json, { indent: 2, lineWidth: -1 });
        yamlOutput.value = yaml;
      } catch (e) {
        errorDiv.textContent = 'Invalid JSON: ' + e.message;
      }
    }

    function yamlToJson() {
      errorDiv.textContent = '';
      try {
        const yaml = yamlOutput.value;
        const json = jsyaml.load(yaml);
        jsonInput.value = JSON.stringify(json, null, 2);
      } catch (e) {
        errorDiv.textContent = 'Invalid YAML: ' + e.message;
      }
    }

    function sample() {
      jsonInput.value = JSON.stringify({
        name: "Project Alpha",
        version: "1.0.0",
        dependencies: {
          "react": "^18.2.0",
          "lodash": "^4.17.21"
        },
        scripts: {
          "test": "jest",
          "build": "webpack"
        },
        private: true
      }, null, 2);
      jsonToYaml();
    }

    function copyOutput() {
      navigator.clipboard.writeText(yamlOutput.value);
      errorDiv.textContent = 'Copied!';
      setTimeout(() => errorDiv.textContent = '', 2000);
    }
  </script>
</body>
</html>
