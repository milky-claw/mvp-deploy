<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Picker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    h1 { margin-bottom: 1.5rem; color: #00d9ff; }
    .container { width: 100%; max-width: 600px; }
    textarea { width: 100%; height: 150px; padding: 1rem; border: 2px solid #333; border-radius: 8px; background: #16213e; color: #eee; font-size: 1rem; resize: vertical; }
    textarea:focus { outline: none; border-color: #00d9ff; }
    .controls { display: flex; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap; }
    button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
    button:active { transform: scale(0.98); }
    .btn-primary { background: #00d9ff; color: #1a1a2e; font-weight: bold; }
    .btn-secondary { background: #333; color: #eee; }
    .btn-danger { background: #ff4757; color: #fff; }
    .result { background: #16213e; border-radius: 12px; padding: 2rem; text-align: center; margin-top: 1.5rem; min-height: 120px; display: flex; align-items: center; justify-content: center; }
    .result.winner { animation: pulse 0.5s ease-out; }
    .winner-text { font-size: 2rem; font-weight: bold; color: #00d9ff; }
    .count { color: #888; margin-top: 1rem; }
    .history { margin-top: 1.5rem; }
    .history h3 { font-size: 1rem; color: #888; margin-bottom: 0.5rem; }
    .history-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .history-item { background: #333; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.875rem; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎲 Random Picker</h1>
    <textarea id="items" placeholder="Enter items (one per line)&#10;Alice&#10;Bob&#10;Charlie&#10;Diana"></textarea>
    <div class="controls">
      <button class="btn-primary" onclick="pickRandom()">Pick Random!</button>
      <button class="btn-secondary" onclick="countItems()">Count Items</button>
      <button class="btn-danger" onclick="clearItems()">Clear</button>
    </div>
    <div class="result" id="result">
      <span style="color: #666;">Enter items and click Pick Random</span>
    </div>
    <div class="count" id="count"></div>
    <div class="history" id="history" style="display: none;">
      <h3>Recent Winners</h3>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
  <script>
    const itemsInput = document.getElementById('items');
    const resultDiv = document.getElementById('result');
    const countDiv = document.getElementById('count');
    const historyDiv = document.getElementById('history');
    const historyList = document.getElementById('historyList');
    let winners = [];

    function getItems() {
      return itemsInput.value.split('\n').filter(item => item.trim() !== '');
    }

    function countItems() {
      const items = getItems();
      countDiv.textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;
    }

    function pickRandom() {
      const items = getItems();
      if (items.length === 0) {
        resultDiv.innerHTML = '<span style="color: #ff4757;">Add some items first!</span>';
        return;
      }
      const winner = items[Math.floor(Math.random() * items.length)];
      resultDiv.innerHTML = `<span class="winner-text">${winner}</span>`;
      resultDiv.classList.add('winner');
      setTimeout(() => resultDiv.classList.remove('winner'), 500);
      countItems();
      addToHistory(winner);
    }

    function addToHistory(winner) {
      winners.unshift(winner);
      if (winners.length > 5) winners.pop();
      historyDiv.style.display = 'block';
      historyList.innerHTML = winners.map(w => `<span class="history-item">${w}</span>`).join('');
    }

    function clearItems() {
      itemsInput.value = '';
      resultDiv.innerHTML = '<span style="color: #666;">Enter items and click Pick Random</span>';
      countDiv.textContent = '';
      winners = [];
      historyDiv.style.display = 'none';
    }
  </script>
</body>
</html>
