<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: #16213e; padding: 40px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
    h1 { text-align: center; margin-bottom: 30px; color: #00d9ff; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; color: #aaa; }
    textarea, input, select { width: 100%; padding: 14px; border: 2px solid #0f3460; border-radius: 8px; background: #0f3460; color: #fff; font-size: 16px; transition: border-color 0.3s; }
    textarea:focus, input:focus, select:focus { outline: none; border-color: #00d9ff; }
    textarea { min-height: 100px; resize: vertical; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #00d9ff, #00a8cc); color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,217,255,0.3); }
    .btn:active { transform: translateY(0); }
    #qr-result { margin-top: 30px; text-align: center; }
    #qr-result canvas { max-width: 100%; height: auto !important; }
    .error { color: #ff6b6b; text-align: center; margin-top: 10px; }
    .download-link { display: inline-block; margin-top: 15px; color: #00d9ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 QR Code Generator</h1>
    <div class="input-group">
      <label>Enter text or URL</label>
      <textarea id="text-input" placeholder="https://example.com or any text...">https://example.com</textarea>
    </div>
    <div class="input-group">
      <label>Size</label>
      <select id="size">
        <option value="128">128 x 128 (Small)</option>
        <option value="256" selected>256 x 256 (Medium)</option>
        <option value="512">512 x 512 (Large)</option>
      </select>
    </div>
    <button class="btn" onclick="generateQR()">Generate QR Code</button>
    <div id="qr-result"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    function generateQR() {
      const text = document.getElementById('text-input').value.trim();
      const size = parseInt(document.getElementById('size').value);
      const container = document.getElementById('qr-result');
      container.innerHTML = '';
      
      if (!text) {
        container.innerHTML = '<p class="error">Please enter some text</p>';
        return;
      }
      
      QRCode.toCanvas(text, { width: size, margin: 2, color: { dark: '#000000', light: '#ffffff' } }, function(err, canvas) {
        if (err) {
          container.innerHTML = '<p class="error">Error: ' + err.message + '</p>';
          return;
        }
        container.appendChild(canvas);
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = 'qrcode.png';
        link.className = 'download-link';
        link.textContent = '⬇ Download PNG';
        container.appendChild(link);
      });
    }
    generateQR();
  </script>
</body>
</html>
