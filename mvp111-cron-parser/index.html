<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cron Parser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 2rem; color: #a8e6cf; }
    .card { background: #16213e; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    input[type="text"] { width: 100%; background: #0f0f23; border: 1px solid #333; border-radius: 8px; color: #fff; padding: 1rem; font-family: monospace; font-size: 18px; }
    input[type="text"]:focus { outline: none; border-color: #a8e6cf; }
    .btn-group { display: flex; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
    button { background: #a8e6cf; color: #1a1a2e; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
    button:hover { transform: scale(1.02); }
    button.secondary { background: #333; color: #fff; }
    .help { background: #0f3460; padding: 1rem; border-radius: 8px; margin-top: 1rem; }
    .help h4 { color: #a8e6cf; margin-bottom: 0.5rem; }
    .help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.5rem; font-size: 13px; }
    .help-item { background: #16213e; padding: 0.5rem; border-radius: 4px; }
    .help-item code { color: #a8e6cf; }
    .result { background: #0f0f23; padding: 1rem; border-radius: 8px; margin-top: 1rem; }
    .result h3 { color: #a8e6cf; margin-bottom: 0.5rem; font-size: 14px; }
    .next-runs { list-style: none; }
    .next-runs li { padding: 0.5rem 0; border-bottom: 1px solid #333; }
    .next-runs li:last-child { border-bottom: none; }
    .human { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏰ Cron Parser</h1>
    
    <div class="card">
      <input type="text" id="cron" placeholder="* * * * *" value="0 9 * * 1-5">
      <div class="btn-group">
        <button onclick="parse()">Parse & Calculate Next Runs</button>
        <button class="secondary" onclick="loadPresets()">Presets</button>
        <button class="secondary" onclick="clearAll()">Clear</button>
      </div>
    </div>
    
    <div class="card help">
      <h4>Format: minute hour day month weekday</h4>
      <div class="help-grid">
        <div class="help-item"><code>*</code> any</div>
        <div class="help-item"><code>0-59</code> minute</div>
        <div class="help-item"><code>0-23</code> hour</div>
        <div class="help-item"><code>1-31</code> day</div>
        <div class="help-item"><code>1-12</code> month</div>
        <div class="help-item"><code>0-6</code> weekday (0=Sun)</div>
        <div class="help-item"><code>*/5</code> every 5</div>
        <div class="help-item"><code>1,3,5</code> list</div>
        <div class="help-item"><code>1-5</code> range</div>
      </div>
    </div>
    
    <div id="output" style="display:none;" class="card">
      <div class="result">
        <h3>Description</h3>
        <div id="desc"></div>
      </div>
      <div class="result">
        <h3>Next 10 Runs</h3>
        <ul id="nextRuns" class="next-runs"></ul>
      </div>
    </div>
  </div>

  <script>
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    
    function parse() {
      const cron = document.getElementById('cron').value.trim();
      const parts = cron.split(/\s+/);
      
      if (parts.length !== 5) {
        alert('Invalid cron: need 5 fields (minute hour day month weekday)');
        return;
      }
      
      try {
        const [min, hour, day, month, dow] = parts;
        
        // Generate next runs
        const runs = [];
        let date = new Date();
        date.setSeconds(0);
        date.setMilliseconds(0);
        
        while (runs.length < 10) {
          date.setMinutes(date.getMinutes() + 1);
          
          if (matches(date, min, hour, day, month, dow)) {
            runs.push(new Date(date));
          }
          
          // Safety limit
          if (date.getTime() > Date.now() + 365 * 24 * 60 * 60 * 1000) break;
        }
        
        // Display
        document.getElementById('desc').textContent = describe(min, hour, day, month, dow);
        const ul = document.getElementById('nextRuns');
        ul.innerHTML = runs.map((r, i) => `
          <li>
            <strong>${r.toLocaleString()}</strong>
            <span class="human">(${humanize(r)})</span>
          </li>
        `).join('');
        
        document.getElementById('output').style.display = 'block';
      } catch (e) {
        alert('Error parsing cron: ' + e.message);
      }
    }
    
    function matches(date, min, hour, day, month, dow) {
      return fieldMatch(date.getMinutes(), min) &&
             fieldMatch(date.getHours(), hour) &&
             fieldMatch(date.getDate(), day) &&
             fieldMatch(date.getMonth() + 1, month) &&
             fieldMatch(date.getDay(), dow);
    }
    
    function fieldMatch(val, field) {
      if (field === '*') return true;
      
      // Handle lists
      if (field.includes(',')) {
        return field.split(',').some(f => fieldMatch(val, f));
      }
      
      // Handle ranges
      if (field.includes('-')) {
        const [start, end] = field.split('-').map(Number);
        return val >= start && val <= end;
      }
      
      // Handle steps
      if (field.includes('/')) {
        const [base, step] = field.split('/');
        const stepNum = parseInt(step);
        if (base === '*') {
          return val % stepNum === 0;
        }
        const baseNum = parseInt(base);
        return val >= baseNum && (val - baseNum) % stepNum === 0;
      }
      
      return parseInt(field) === val;
    }
    
    function describe(min, hour, day, month, dow) {
      let parts = [];
      
      // Minute
      if (min === '*') parts.push('every minute');
      else if (min === '0') parts.push('at minute 0');
      else parts.push(`at minute ${min}`);
      
      // Hour
      if (hour !== '*') parts.push(`of hour ${hour}`);
      
      // Day
      if (day !== '*') parts.push(`on day ${day}`);
      
      // Month
      if (month !== '*') parts.push(`in ${MONTHS[month-1] || month}`);
      
      // Day of week
      if (dow !== '*') {
        if (dow === '1-5') parts.push('on weekdays');
        else if (dow === '0,6') parts.push('on weekends');
        else parts.push(`on ${DAYS[dow] || dow}`);
      }
      
      return parts.join(', ');
    }
    
    function humanize(date) {
      const now = new Date();
      const diff = date - now;
      const mins = Math.floor(diff / 60000);
      const hours = Math.floor(mins / 60);
      const days = Math.floor(hours / 24);
      
      if (days > 0) return `in ${days} day${days > 1 ? 's' : ''}`;
      if (hours > 0) return `in ${hours} hour${hours > 1 ? 's' : ''}`;
      if (mins > 0) return `in ${mins} minute${mins > 1 ? 's' : ''}`;
      return 'now';
    }
    
    function loadPresets() {
      const presets = [
        { label: 'Every minute', val: '* * * * *' },
        { label: 'Every hour', val: '0 * * * *' },
        { label: 'Daily at 9am', val: '0 9 * * *' },
        { label: 'Weekdays at 9am', val: '0 9 * * 1-5' },
        { label: 'Every Monday', val: '0 9 * * 1' },
        { label: 'Every 15 mins', val: '*/15 * * * *' },
      ];
      
      const select = prompt('Choose preset:\n' + presets.map((p, i) => `${i+1}. ${p.label}`).join('\n'));
      const idx = parseInt(select) - 1;
      if (idx >= 0 && idx < presets.length) {
        document.getElementById('cron').value = presets[idx].val;
        parse();
      }
    }
    
    function clearAll() {
      document.getElementById('cron').value = '';
      document.getElementById('output').style.display = 'none';
    }
  </script>
</body>
</html>
