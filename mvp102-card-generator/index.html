<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Card Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1e1e2f; color: #fff; min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 10px; color: #ff6b6b; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    button { background: #ff6b6b; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
    button:hover { background: #ff5252; }
    button.secondary { background: #2d2d44; }
    button.secondary:hover { background: #3d3d5c; }
    select { background: #2d2d44; color: #fff; border: 1px solid #3d3d5c; padding: 12px; border-radius: 8px; }
    .card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px; padding: 24px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; }
    .card-brand { position: absolute; top: 20px; right: 20px; font-size: 24px; opacity: 0.8; }
    .card-number { font-size: 22px; letter-spacing: 3px; margin: 40px 0 20px; font-family: 'Courier New', monospace; }
    .card-details { display: flex; justify-content: space-between; }
    .card-label { font-size: 10px; opacity: 0.7; text-transform: uppercase; }
    .card-value { font-size: 14px; margin-top: 4px; }
    .warning { background: #2d2d44; border: 1px solid #ff6b6b; border-radius: 8px; padding: 12px; margin-bottom: 20px; font-size: 12px; color: #ff6b6b; text-align: center; }
    .copy-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 10px; }
    .copy-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <h1>💳 Test Card Generator</h1>
    <p class="subtitle">Generate valid-format card numbers for testing payments</p>
    
    <div class="warning">⚠️ For testing only. Do not use for fraud.</div>
    
    <div class="controls">
      <select id="brand">
        <option value="visa">Visa</option>
        <option value="mastercard">Mastercard</option>
        <option value="amex">American Express</option>
        <option value="discover">Discover</option>
      </select>
      <button onclick="generate()">Generate</button>
      <button class="secondary" onclick="copy()">Copy Number</button>
    </div>
    
    <div class="card" id="card">
      <div class="card-brand" id="brandIcon">💳</div>
      <div class="card-number">
        <span id="number">**** **** **** ****</span>
        <button class="copy-btn" onclick="copy()">Copy</button>
      </div>
      <div class="card-details">
        <div>
          <div class="card-label">Card Holder</div>
          <div class="card-value">TEST USER</div>
        </div>
        <div>
          <div class="card-label">Expires</div>
          <div class="card-value" id="expiry">12/28</div>
        </div>
        <div>
          <div class="card-label">CVV</div>
          <div class="card-value" id="cvv">***</div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const brands = {
      visa: { prefix: '4', length: 16, icon: '💳' },
      mastercard: { prefix: '5', length: 16, icon: '💳' },
      amex: { prefix: '3', length: 15, icon: '💳' },
      discover: { prefix: '6', length: 16, icon: '💳' }
    };
    
    function luhn(card) {
      let sum = 0, isEven = false;
      for (let i = card.length - 1; i >= 0; i--) {
        let digit = parseInt(card[i]);
        if (isEven) { digit *= 2; if (digit > 9) digit -= 9; }
        sum += digit;
        isEven = !isEven;
      }
      return sum % 10 === 0;
    }
    
    function generate() {
      const brand = document.getElementById('brand').value;
      const config = brands[brand];
      let num = config.prefix;
      
      while (num.length < config.length - 1) {
        num += Math.floor(Math.random() * 10);
      }
      
      for (let i = 0; i < 10; i++) {
        const test = num + i;
        if (luhn(test)) {
          num = test;
          break;
        }
      }
      
      const formatted = brand === 'amex' 
        ? `${num.slice(0,4)} ${num.slice(4,10)} ${num.slice(10)}`
        : `${num.slice(0,4)} ${num.slice(4,8)} ${num.slice(8,12)} ${num.slice(12)}`;
      
      document.getElementById('number').textContent = formatted;
      document.getElementById('brandIcon').textContent = config.icon;
      document.getElementById('expiry').textContent = `${String(Math.floor(Math.random()*12)+1).padStart(2,'0')}/${String(2026 + Math.floor(Math.random()*5)).slice(-2)}`;
      document.getElementById('cvv').textContent = String(Math.floor(Math.random()*900)+100);
    }
    
    function copy() {
      const num = document.getElementById('number').textContent.replace(/\s/g, '');
      navigator.clipboard.writeText(num);
    }
    
    generate();
  </script>
</body>
</html>
