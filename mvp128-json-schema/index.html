<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Schema Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: #ff6b6b; margin-bottom: 1rem; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .panel { background: #16213e; padding: 1rem; border-radius: 12px; }
    label { display: block; color: #aaa; margin-bottom: 0.5rem; }
    textarea { width: 100%; height: 300px; background: #0f3460; border: 1px solid #ff6b6b; color: #fff; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 14px; resize: vertical; }
    .btn-row { margin: 1rem 0; display: flex; gap: 1rem; }
    button { background: #ff6b6b; color: #1a1a2e; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #ff5252; }
    .error { color: #ff6b6b; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 JSON Schema Generator</h1>
    <div class="btn-row">
      <button onclick="generateSchema()">Generate Schema</button>
      <button onclick="sample()">Load Sample</button>
    </div>
    <div class="panels">
      <div class="panel">
        <label>Input JSON</label>
        <textarea id="input" placeholder='{"name": "John", "age": 30}'></textarea>
        <div class="error" id="error"></div>
      </div>
      <div class="panel">
        <label>Generated Schema</label>
        <textarea id="output" readonly></textarea>
      </div>
    </div>
  </div>
  <script>
    function sample() {
      document.getElementById('input').value = JSON.stringify({
        "id": 1,
        "name": "John Doe",
        "email": "john@example.com",
        "age": 30,
        "roles": ["admin", "user"],
        "active": true,
        "metadata": { "created": "2024-01-01" }
      }, null, 2);
    }
    
    function inferType(val) {
      if (val === null) return { type: "null" };
      if (Array.isArray(val)) {
        if (val.length === 0) return { type: "array", items: { type: "string" } };
        return { type: "array", items: inferType(val[0]) };
      }
      switch (typeof val) {
        case 'number': return Number.isInteger(val) ? { type: "integer" } : { type: "number" };
        case 'boolean': return { type: "boolean" };
        case 'object': return { type: "object", properties: {}, required: [] };
        default: return { type: "string" };
      }
    }
    
    function generateSchema() {
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      try {
        const input = JSON.parse(document.getElementById('input').value);
        const schema = { type: "object", properties: {}, required: [] };
        
        for (const [key, val] of Object.entries(input)) {
          schema.properties[key] = inferType(val);
          schema.required.push(key);
        }
        
        if (schema.required.length === 0) delete schema.required;
        document.getElementById('output').value = JSON.stringify(schema, null, 2);
      } catch (e) {
        errorEl.textContent = 'Invalid JSON: ' + e.message;
      }
    }
    
    sample();
  </script>
</body>
</html>
