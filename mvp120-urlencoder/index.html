<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Encoder/Decoder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; background: #0d1117; color: #fff; padding: 40px 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; font-weight: 300; letter-spacing: 2px; }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .panel h3 { color: #8b949e; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; font-weight: 500; }
    textarea { width: 100%; height: 100px; padding: 12px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #fff; font-size: 14px; font-family: monospace; resize: vertical; }
    textarea:focus { outline: none; border-color: #58a6ff; }
    .buttons { display: flex; gap: 10px; margin: 15px 0; }
    button { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; }
    .btn-encode { background: #238636; color: #fff; }
    .btn-encode:hover { background: #2ea043; }
    .btn-decode { background: #da3633; color: #fff; }
    .btn-decode:hover { background: #f85149; }
    .btn-copy { background: #30363d; color: #fff; }
    .btn-copy:hover { background: #484f58; }
    .btn-clear { background: transparent; border: 1px solid #30363d; color: #8b949e; }
    .btn-clear:hover { border-color: #8b949e; }
    .actions { display: flex; justify-content: space-between; align-items: center; }
    .result { color: #7ee787; font-size: 13px; opacity: 0; transition: opacity 0.3s; }
    .result.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 URL Encoder</h1>
    <div class="panel">
      <h3>Input</h3>
      <textarea id="input" placeholder="Enter text or URL to encode/decode..."></textarea>
    </div>
    <div class="buttons">
      <button class="btn-encode" onclick="encode()">Encode</button>
      <button class="btn-decode" onclick="decode()">Decode</button>
      <button class="btn-clear" onclick="clearAll()">Clear</button>
    </div>
    <div class="panel">
      <h3>Output</h3>
      <textarea id="output" readonly placeholder="Result will appear here..."></textarea>
    </div>
    <div class="actions">
      <button class="btn-copy" onclick="copy()">📋 Copy Result</button>
      <span class="result" id="result">Copied!</span>
    </div>
  </div>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const result = document.getElementById('result');

    function encode() {
      try {
        output.value = encodeURIComponent(input.value);
      } catch (e) {
        output.value = 'Error: ' + e.message;
      }
    }

    function decode() {
      try {
        output.value = decodeURIComponent(input.value);
      } catch (e) {
        output.value = 'Error: Invalid encoded string';
      }
    }

    function clearAll() {
      input.value = '';
      output.value = '';
    }

    function copy() {
      if (!output.value) return;
      navigator.clipboard.writeText(output.value).then(() => {
        result.classList.add('show');
        setTimeout(() => result.classList.remove('show'), 2000);
      });
    }

    // Auto-decode on load if param exists
    const params = new URLSearchParams(window.location.search);
    if (params.has('q')) {
      input.value = params.get('q');
      decode();
    }
  </script>
</body>
</html>
