<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Ipsum Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 2rem; color: #feca57; }
    .panel { background: #16213e; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #aaa; }
    .controls { display: flex; gap: 1rem; flex-wrap: wrap; }
    .control { flex: 1; min-width: 150px; }
    .control input, .control select { width: 100%; background: #0f0f23; border: 1px solid #333; border-radius: 8px; padding: 0.75rem; color: #fff; font-size: 14px; }
    .btn-group { display: flex; gap: 1rem; margin-top: 1rem; }
    button { flex: 1; padding: 1rem; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
    button:hover { transform: translateY(-2px); }
    .generate { background: #feca57; color: #1a1a2e; }
    .copy { background: #4ecca3; color: #1a1a2e; }
    .output { background: #0f0f23; border: 1px solid #333; border-radius: 8px; padding: 1.5rem; color: #ccc; line-height: 1.8; font-size: 15px; min-height: 200px; white-space: pre-wrap; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: #4ecca3; color: #1a1a2e; padding: 1rem 2rem; border-radius: 8px; font-weight: 600; opacity: 0; transition: transform 0.3s, opacity 0.3s; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Lorem Ipsum Generator</h1>
    
    <div class="panel">
      <div class="controls">
        <div class="control">
          <label>Paragraphs</label>
          <input type="number" id="paragraphs" value="3" min="1" max="20">
        </div>
        <div class="control">
          <label>Type</label>
          <select id="type">
            <option value="paras">Paragraphs</option>
            <option value="words">Words</option>
            <option value="bytes">Bytes</option>
          </select>
        </div>
        <div class="control">
          <label>Start with "Lorem..."</label>
          <select id="startWithLorem">
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
      </div>
      <div class="btn-group">
        <button class="generate" onclick="generate()">Generate</button>
        <button class="copy" onclick="copy()">📋 Copy</button>
      </div>
    </div>
    
    <div class="panel">
      <label>Output</label>
      <div class="output" id="output"></div>
    </div>
  </div>
  
  <div class="toast" id="toast">Copied!</div>

  <script>
    const words = ['lorem', 'ipsum', 'dolor', 'sit', 'amet', 'consectetur', 'adipiscing', 'elit', 'sed', 'do', 'eiusmod', 'tempor', 'incididunt', 'ut', 'labore', 'et', 'dolore', 'magna', 'aliqua', 'enim', 'ad', 'minim', 'veniam', 'quis', 'nostrud', 'exercitation', 'ullamco', 'laboris', 'nisi', 'aliquip', 'ex', 'ea', 'commodo', 'consequat', 'duis', 'aute', 'irure', 'in', 'reprehenderit', 'voluptate', 'velit', 'esse', 'cillum', 'fugiat', 'nulla', 'pariatur', 'excepteur', 'sint', 'occaecat', 'cupidatat', 'non', 'proident', 'sunt', 'culpa', 'qui', 'officia', 'deserunt', 'mollit', 'anim', 'id', 'est', 'laborum'];
    
    function generate() {
      const paragraphs = parseInt(document.getElementById('paragraphs').value) || 3;
      const type = document.getElementById('type').value;
      const startWithLorem = document.getElementById('startWithLorem').value === 'true';
      
      let output = '';
      
      if (type === 'paras') {
        for (let p = 0; p < paragraphs; p++) {
          let paraWords = [];
          const numWords = Math.floor(Math.random() * 20) + 30;
          for (let i = 0; i < numWords; i++) {
            paraWords.push(words[Math.floor(Math.random() * words.length)]);
          }
          if (p === 0 && startWithLorem) {
            paraWords.unshift('Lorem', 'ipsum', 'dolor', 'sit', 'amet');
          }
          paraWords[0] = paraWords[0].charAt(0).toUpperCase() + paraWords[0].slice(1);
          output += paraWords.join(' ') + '.\n\n';
        }
      } else if (type === 'words') {
        const numWords = paragraphs * 30;
        for (let i = 0; i < numWords; i++) {
          output += (i > 0 ? ' ' : '') + (i === 0 && startWithLorem ? 'Lorem' : words[Math.floor(Math.random() * words.length)]);
        }
      } else if (type === 'bytes') {
        const numBytes = paragraphs * 50;
        const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        for (let i = 0; i < numBytes; i++) {
          output += chars.charAt(Math.floor(Math.random() * chars.length));
        }
      }
      
      document.getElementById('output').textContent = output.trim();
    }
    
    function copy() {
      const text = document.getElementById('output').textContent;
      navigator.clipboard.writeText(text);
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    generate();
  </script>
</body>
</html>
