<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Parser</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee; }
    h1 { color: #7209b7; }
    label { display: block; margin: 15px 0 5px; color: #00d9ff; }
    input { width: 100%; background: #16213e; color: #eee; border: 1px solid #0f3460; border-radius: 8px; padding: 12px; font-size: 16px; }
    .btn-group { margin: 15px 0; }
    button { background: #7209b7; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 10px; }
    button:hover { background: #560bad; }
    .parsed { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; margin: 10px 0; }
    .parsed-row { display: flex; border-bottom: 1px solid #0f3460; padding: 10px 0; }
    .parsed-row:last-child { border-bottom: none; }
    .parsed-label { width: 140px; color: #888; font-weight: bold; flex-shrink: 0; }
    .parsed-value { font-family: monospace; word-break: break-all; color: #00d9ff; }
    .params-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .params-table th, .params-table td { text-align: left; padding: 8px; border: 1px solid #0f3460; }
    .params-table th { background: #0f3460; color: #fff; }
    .params-table td { font-family: monospace; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>URL Parser</h1>
  <p>Parse URLs into components and query parameters</p>

  <label>Enter URL</label>
  <input id="urlInput" placeholder="https://example.com/path?param1=value1&param2=value2" onkeydown="if(event.key==='Enter')parseUrl()">

  <div class="btn-group">
    <button onclick="parseUrl()">Parse URL</button>
    <button onclick="document.getElementById('urlInput').value=''; clearResults()">Clear</button>
  </div>

  <div id="results"></div>

  <script>
    function parseUrl() {
      const urlStr = document.getElementById('urlInput').value.trim();
      const results = document.getElementById('results');
      results.innerHTML = '';

      if (!urlStr) {
        results.innerHTML = '<p class="error">Please enter a URL</p>';
        return;
      }

      try {
        let url;
        // Handle incomplete URLs
        if (!urlStr.includes('://')) {
          url = new URL('https://' + urlStr);
        } else {
          url = new URL(urlStr);
        }

        // Protocol
        addRow('Protocol', url.protocol);

        // Host
        addRow('Host', url.hostname);

        // Port
        addRow('Port', url.port || '(default)');

        // Path
        addRow('Path', url.pathname);

        // Hash
        addRow('Hash', url.hash || '(none)');

        // Origin
        addRow('Origin', url.origin);

        // Query Parameters
        if (url.searchParams.toString()) {
          const paramsDiv = document.createElement('div');
          paramsDiv.className = 'parsed';
          let html = '<div class="parsed-label">Query Params</div>';
          html += '<table class="params-table"><tr><th>Key</th><th>Value</th></tr>';
          url.searchParams.forEach((val, key) => {
            html += `<tr><td>${escapeHtml(key)}</td><td>${escapeHtml(val)}</td></tr>`;
          });
          html += '</table>';
          paramsDiv.innerHTML = html;
          results.appendChild(paramsDiv);
        }
      } catch (e) {
        results.innerHTML = '<p class="error">❌ Invalid URL: ' + e.message + '</p>';
      }

      function addRow(label, value) {
        const div = document.createElement('div');
        div.className = 'parsed';
        div.innerHTML = '<div class="parsed-label">' + label + '</div><div class="parsed-value">' + escapeHtml(value) + '</div>';
        results.appendChild(div);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function clearResults() {
      document.getElementById('results').innerHTML = '';
    }
  </script>
</body>
</html>
