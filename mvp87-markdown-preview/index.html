<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1e1e2e; color: #cdd6f4; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #181825; padding: 16px 24px; border-bottom: 1px solid #313244; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 20px; color: #f5c2e7; }
    .header button { padding: 8px 16px; background: #89b4fa; color: #1e1e2e; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .header button:hover { background: #74a4f7; }
    .container { flex: 1; display: flex; }
    .editor, .preview { flex: 1; padding: 24px; overflow-y: auto; }
    .editor { background: #11111b; border-right: 1px solid #313244; }
    .preview { background: #1e1e2e; }
    textarea { width: 100%; height: 100%; background: transparent; border: none; color: #a6adc8; font-family: 'Monaco', 'Menlo', monospace; font-size: 14px; line-height: 1.6; resize: none; outline: none; }
    
    /* Markdown Styles */
    .preview h1, .preview h2, .preview h3 { color: #f5c2e7; margin: 20px 0 10px; }
    .preview h1 { font-size: 28px; border-bottom: 1px solid #313244; padding-bottom: 8px; }
    .preview h2 { font-size: 22px; }
    .preview h3 { font-size: 18px; }
    .preview p { line-height: 1.7; margin: 12px 0; }
    .preview code { background: #313244; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #f9e2af; }
    .preview pre { background: #313244; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0; }
    .preview pre code { background: none; padding: 0; }
    .preview ul, .preview ol { margin: 12px 0; padding-left: 24px; }
    .preview li { margin: 6px 0; }
    .preview blockquote { border-left: 4px solid #f5c2e7; padding-left: 16px; color: #9399b2; margin: 16px 0; }
    .preview a { color: #89b4fa; }
    .preview img { max-width: 100%; border-radius: 8px; }
    .preview table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    .preview th, .preview td { border: 1px solid #313244; padding: 10px; text-align: left; }
    .preview th { background: #313244; }
    .preview hr { border: none; border-top: 1px solid #313244; margin: 24px 0; }
    
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .editor { border-right: none; border-bottom: 1px solid #313244; min-height: 40vh; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📝 Markdown Preview</h1>
    <button id="downloadBtn">Download HTML</button>
  </div>
  <div class="container">
    <div class="editor">
      <textarea id="editor" placeholder="# Hello World&#10;&#10;Write your **markdown** here...&#10;&#10;- List item 1&#10;- List item 2&#10;&#10;```javascript&#10;console.log('code');&#10;```"># Welcome to Markdown Preview

Write your markdown on the left, see the result on the right.

## Features

- Live preview
- Supports GitHub Flavored Markdown
- Download as HTML file

## Try it out!

**Bold text**, *italic text*, `inline code`

> This is a blockquote

| Column 1 | Column 2 |
|----------|----------|
| Cell 1   | Cell 2   |

</textarea>
    </div>
    <div class="preview" id="preview"></div>
  </div>
  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');
    
    const md = {
      escape: s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'),
      process: text => {
        let html = text
          // Code blocks
          .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>')
          // Inline code
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          // Headers
          .replace(/^######\s+(.*)$/gm, '<h6>$1</h6>')
          .replace(/^#####\s+(.*)$/gm, '<h5>$1</h5>')
          .replace(/^####\s+(.*)$/gm, '<h4>$1</h4>')
          .replace(/^###\s+(.*)$/gm, '<h3>$1</h3>')
          .replace(/^##\s+(.*)$/gm, '<h2>$1</h2>')
          .replace(/^#\s+(.*)$/gm, '<h1>$1</h1>')
          // Bold & Italic
          .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/___(.+?)___/g, '<strong><em>$1</em></strong>')
          .replace(/__(.+?)__/g, '<strong>$1</strong>')
          .replace(/_(.+?)_/g, '<em>$1</em>')
          // Blockquotes
          .replace(/^>\s+(.*)$/gm, '<blockquote>$1</blockquote>')
          // Horizontal rule
          .replace(/^---$/gm, '<hr>')
          // Images
          .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
          // Links
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
          // Unordered lists
          .replace(/^[\-\*]\s+(.*)$/gm, '<li>$1</li>')
          // Ordered lists
          .replace(/^\d+\.\s+(.*)$/gm, '<li>$1</li>')
          // Paragraphs
          .replace(/\n\n/g, '</p><p>');
        
        // Wrap list items in ul/ol
        html = html.replace(/(<li>.*<\/li>)+/g, '<ul>$&</ul>');
        
        return '<p>' + html + '</p>';
      }
    };
    
    function render() {
      preview.innerHTML = md.process(editor.value);
    }
    
    editor.addEventListener('input', render);
    
    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Exported</title></head><body>${preview.innerHTML}</body></html>`], {type: 'text/html'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'document.html';
      a.click();
    });
    
    render();
  </script>
</body>
</html>
