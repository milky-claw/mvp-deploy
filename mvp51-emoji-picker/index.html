<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Picker</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #1e1e2e; color: #cdd6f4; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #89b4fa; text-align: center; }
        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 15px; background: #313244; border: none; color: #fff; font-size: 16px; border-radius: 10px; }
        .categories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
        .cat-btn { background: #45475a; border: none; padding: 8px 16px; border-radius: 20px; color: #a6adc8; cursor: pointer; transition: all 0.2s; }
        .cat-btn.active { background: #89b4fa; color: #1e1e2e; }
        .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
        @media (max-width: 600px) { .emoji-grid { grid-template-columns: repeat(6, 1fr); } }
        .emoji { font-size: 32px; text-align: center; padding: 10px; background: #313244; border-radius: 10px; cursor: pointer; transition: transform 0.1s; }
        .emoji:hover { transform: scale(1.2); background: #45475a; }
        .selected { text-align: center; padding: 20px; background: #313244; border-radius: 10px; margin-bottom: 20px; }
        .selected-emoji { font-size: 48px; }
        .copy-hint { color: #a6adc8; font-size: 14px; margin-top: 10px; }
    </style>
</head>

            btn.textContent = cat;
            btn.onclick = () => { currentCategory = cat; render(); };
            cats.appendChild(btn);
        });
        
        function render() {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.cat-btn').forEach(b => { if(b.textContent === currentCategory) b.classList.add('active'); });
            grid.innerHTML = emojis[currentCategory].map(e => `<div class="emoji" onclick="copy('${e}')">${e}</div>`).join('');
        }
        
        function filter() {
            const q = document.getElementById('search').value.toLowerCase();
            if (!q) { render(); return; }
            const all = Object.values(emojis).flat();
            const filtered = [...new Set(all)].filter(e => e);
            grid.innerHTML = filtered.slice(0, 64).map(e => `<div class="emoji" onclick="copy('${e}')">${e}</div>`).join('');
        }
        
        function copy(e) {
            document.getElementById('selected').textContent = e;
            navigator.clipboard.writeText(e);
        }
        
        render();

</body>
</html>
