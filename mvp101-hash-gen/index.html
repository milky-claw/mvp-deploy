<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hash Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 40px 20px; }
    .container { background: #16213e; padding: 40px; border-radius: 16px; width: 100%; max-width: 700px; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
    h1 { text-align: center; margin-bottom: 30px; color: #e94560; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; color: #aaa; }
    textarea { width: 100%; padding: 14px; border: 2px solid #0f3460; border-radius: 8px; background: #0f3460; color: #fff; font-size: 16px; min-height: 100px; resize: vertical; }
    textarea:focus { outline: none; border-color: #e94560; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #e94560, #c73e54); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
    .btn:hover { transform: translateY(-2px); }
    .results { margin-top: 30px; }
    .hash-row { background: #0f3460; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
    .hash-row:last-child { margin-bottom: 0; }
    .hash-label { font-weight: 600; color: #e94560; margin-bottom: 8px; font-size: 14px; }
    .hash-value { font-family: 'Monaco', 'Menlo', monospace; font-size: 13px; word-break: break-all; color: #00d9ff; background: #1a1a2e; padding: 12px; border-radius: 6px; }
    .copy-btn { float: right; background: #e94560; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .copy-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Hash Generator</h1>
    <div class="input-group">
      <label>Enter text to hash</label>
      <textarea id="input" placeholder="Type or paste text here...">Hello World</textarea>
    </div>
    <button class="btn" onclick="generateHashes()">Generate Hashes</button>
    <div class="results" id="results"></div>
  </div>
  <script>
    async function generateHashes() {
      const text = document.getElementById('input').value;
      const results = document.getElementById('results');
      results.innerHTML = '';
      
      if (!text) {
        results.innerHTML = '<p style="color:#ff6b6b;text-align:center;">Please enter some text</p>';
        return;
      }
      
      const enc = new TextEncoder();
      const data = enc.encode(text);
      
      const algorithms = [
        { name: 'MD5 (128-bit)', algo: 'MD5' },
        { name: 'SHA-1 (160-bit)', algo: 'SHA-1' },
        { name: 'SHA-256 (256-bit)', algo: 'SHA-256' },
        { name: 'SHA-384 (384-bit)', algo: 'SHA-384' },
        { name: 'SHA-512 (512-bit)', algo: 'SHA-512' }
      ];
      
      for (const { name, algo } of algorithms) {
        try {
          let hash;
          if (algo === 'MD5') {
            // MD5 via external lib
            hash = await md5(text);
          } else {
            const buf = await crypto.subtle.digest(algo, data);
            hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
          }
          
          const row = document.createElement('div');
          row.className = 'hash-row';
          row.innerHTML = `
            <div class="hash-label">${name} <button class="copy-btn" onclick="copyToClipboard('${hash}')">Copy</button></div>
            <div class="hash-value">${hash}</div>
          `;
          results.appendChild(row);
        } catch (e) {
          console.log('Skipping unsupported algo:', algo);
        }
      }
    }
    
    async function md5(str) {
      // Simple MD5 implementation
      const rotateLeft = (value, shift) => (value << shift) | (value >>> (32 - shift));
      const addUnsigned = (x, y) => {
        let result = (x & 0x7FFFFFFF) + (y & 0x7FFFFFFF);
        if (x & 0x80000000) {
          if (y & 0x80000000) result = result + 0x80000000;
          else result = result + 0x80000000;
        }
        return result;
      };
      const F = (x, y, z) => (x & y) | (~x & z);
      const G = (x, y, z) => (x & z) | (y & ~z);
      const H = (x, y, z) => x ^ y ^ z;
      const I = (x, y, z) => y ^ (x | ~z);
      const FF = (a, b, c, d, x, s, ac) => { a = addUnsigned(a, addUnsigned(addUnsigned(F(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); };
      const GG = (a, b, c, d, x, s, ac) => { a = addUnsigned(a, addUnsigned(addUnsigned(G(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); };
      const HH = (a, b, c, d, x, s, ac) => { a = addUnsigned(a, addUnsigned(addUnsigned(H(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); };
      const II = (a, b, c, d, x, s, ac) => { a = addUnsigned(a, addUnsigned(addUnsigned(I(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); };
      
      const convertToWordArray = (str) => {
        let lWordCount, lMessageLength = str.length, lNumberOfWords = [];
        for (lNumberOfWords[((lMessageLength + 8) >>> 6) + 1] = 0, lWordCount = 0; lWordCount < lNumberOfWords.length; lWordCount++) lNumberOfWords[lWordCount] = 0;
        let lBytePosition = 0, lByteCount = 0;
        while (lByteCount < lMessageLength) {
          let lWordIndex = (lByteCount - (lByteCount % 4)) / 4;
          lBytePosition = (lByteCount % 4) * 8;
          lNumberOfWords[lWordIndex] = lNumberOfWords[lWordIndex] | (str.charCodeAt(lByteCount) << lBytePosition);
          lByteCount++;
        }
        lWordIndex = (lByteCount - (lByteCount % 4)) / 4;
        lBytePosition = (lByteCount % 4) * 8;
        lNumberOfWords[lWordIndex] = lNumberOfWords[lWordIndex] | (0x80 << lBytePosition);
        lNumberOfWords[((lMessageLength + 8) >>> 6) + 1] = lMessageLength * 8;
        return lNumberOfWords;
      };
      
      const wordToHex = (value) => {
        let word, lsb, hex = '0123456789abcdef';
        for (let i = 0; i <= 3; i++) {
          word = (value >>> (i * 8)) & 255;
          lsb = hex.charAt((word >> 4) & 0x0F) + hex.charAt(word & 0x0F);
          hex += lsb;
        }
        return hex;
      };
    
      const x = convertToWordArray(str);
      let a = 0x67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
      let S1 = 7, S2 = 12, S3 = 17, S4 = 22, S5 = 5, S6 = 9, S7 = 14, S8 = 20, S9 = 4, S10 = 11, S11 = 16, S12 = 23, S13 = 6, S14 = 10, S15 = 15, S16 = 21;
      
      for (let k = 0; k < x.length; k += 16) {
        let aa = a, bb = b, cc = c, dd = d;
        a = FF(a, b, c, d, x[k + 0], S1, 0xD76AA478); d = FF(d, a, b, c, x[k + 1], S2, 0xE8C7B756); c = FF(c, d, a, b, x[k + 2], S3, 0x242070DB); b = FF(b, c, d, a, x[k + 3], S4, 0xC1BDCEEE);
        a = FF(a, b, c, d, x[k + 4], S1, 0xF57C0FAF); d = FF(d, a, b, c, x[k + 5], S2, 0x4787C62A); c = FF(c, d, a, b, x[k + 6], S3, 0xA8304613); b = FF(b, c, d, a, x[k + 7], S4, 0xFD469501);
        a = FF(a, b, c, d, x[k + 8], S1, 0x698098D8); d = FF(d, a, b, c, x[k + 9], S2, 0x8B44F7AF); c = FF(c, d, a, b, x[k + 10], S3, 0xFFFF5BB1); b = FF(b, c, d, a, x[k + 11], S4, 0x895CD7BE);
        a = FF(a, b, c, d, x[k + 12], S1, 0x6B901122); d = FF(d, a, b, c, x[k + 13], S2, 0xFD987193); c = FF(c, d, a, b, x[k + 14], S3, 0xA679438E); b = FF(b, c, d, a, x[k + 15], S4, 0x49B40821);
        a = GG(a, b, c, d, x[k + 1], S5, 0xF61E2562); d = GG(d, a, b, c, x[k + 6], S6, 0xC040B340); c = GG(c, d, a, b, x[k + 11], S7, 0x265E5A51); b = GG(b, c, d, a, x[k + 0], S8, 0xE9B6C7AA);
        a = GG(a, b, c, d, x[k + 5], S5, 0xD62F105); d = GG(d, a, b, c, x[k + 10], S6, 0x2441453); c = GG(c, d, a, b, x[k + 15], S7, 0xD8A1E681); b = GG(b, c, d, a, x[k + 4], S8, 0xE7D3FBC8);
        a = GG(a, b, c, d, x[k + 9], S5, 0x21E1CDE6); d = GG(d, a, b, c, x[k + 14], S6, 0xC33707D6); c = GG(c, d, a, b, x[k + 3], S7, 0xF4D50D87); b = GG(b, c, d, a, x[k + 8], S8, 0x455A14ED);
        a = GG(a, b, c, d, x[k + 13], S5, 0xA9E3E905); d = GG(d, a, b, c, x[k + 2], S6, 0xFCEFA3F8); c = GG(c, d, a, b, x[k + 7], S7, 0x676F02D9); b = GG(b, c, d, a, x[k + 12], S8, 0x8D2A4C8A);
        a = HH(a, b, c, d, x[k + 5], S9, 0xFFFA3942); d = HH(d, a, b, c, x[k + 8], S10, 0x8771F681); c = HH(c, d, a, b, x[k + 11], S11, 0x6D9D6122); b = HH(b, c, d, a, x[k + 14], S12, 0xFDE5380C);
        a = HH(a, b, c, d, x[k + 1], S9, 0xA4BEEA44); d = HH(d, a, b, c, x[k + 4], S10, 0x4BDECFA9); c = HH(c, d, a, b, x[k + 7], S11, 0xF6BB4B60); b = HH(b, c, d, a, x[k + 10], S12, 0xBEBFBC70);
        a = HH(a, b, c, d, x[k + 13], S9, 0x289B7EC6); d = HH(d, a, b, c, x[k + 0], S10, 0xEAA127FA); c = HH(c, d, a, b, x[k + 3], S11, 0xD4EF3085); b = HH(b, c, d, a, x[k + 6], S12, 0x4881D05);
        a = HH(a, b, c, d, x[k + 9], S9, 0xD9D4D039); d = HH(d, a, b, c, x[k + 12], S10, 0xE6DB99E5); c = HH(c, d, a, b, x[k + 15], S11, 0x1FA27CF8); b = HH(b, c, d, a, x[k + 2], S12, 0xC4AC5665);
        a = II(a, b, c, d, x[k + 0], S13, 0xF4292244); d = II(d, a, b, c, x[k + 7], S14, 0x432AFF97); c = II(c, d, a, b, x[k + 14], S15, 0xAB9423A7); b = II(b, c, d, a, x[k + 5], S16, 0xFC93A039);
        a = II(a, b, c, d, x[k + 12], S13, 0x655B59C3); d = II(d, a, b, c, x[k + 3], S14, 0x8F0CCC92); c = II(c, d, a, b, x[k + 10], S15, 0xFFEFF47D); b = II(b, c, d, a, x[k + 1], S16, 0x85845DD1);
        a = II(a, b, c, d, x[k + 8], S13, 0x6FA87E4F); d = II(d, a, b, c, x[k + 15], S14, 0xFE2CE6E0); c = II(c, d, a, b, x[k + 6], S15, 0xA3014314); b = II(b, c, d, a, x[k + 13], S16, 0x4E0811A1);
        a = II(a, b, c, d, x[k + 4], S13, 0xF7537E82); d = II(d, a, b, c, x[k + 11], S14, 0xBD3AF235); c = II(c, d, a, b, x[k + 2], S15, 0x2AD7D2BB); b = II(b, c, d, a, x[k + 9], S16, 0xEB86D391);
        a = addUnsigned(a, aa); b = addUnsigned(b, bb); c = addUnsigned(c, cc); d = addUnsigned(d, dd);
      }
      return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
    }
    
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied!');
      });
    }
    generateHashes();
  </script>
</body>
</html>
