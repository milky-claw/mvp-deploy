<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Converter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 2rem; color: #ff6b9d; }
        .panel { background: #16213e; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.9rem; }
        textarea { width: 100%; height: 150px; background: #0f0f23; border: 1px solid #333; border-radius: 8px; color: #fff; padding: 1rem; font-size: 1.1rem; resize: vertical; }
        textarea:focus { outline: none; border-color: #ff6b9d; }
        .buttons { display: flex; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
        button { background: #ff6b9d; color: #1a1a2e; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
        button:hover { transform: translateY(-1px); }
        button.secondary { background: #333; color: #fff; }
        .result { background: #0f0f23; border: 1px solid #ff6b9d33; border-radius: 8px; padding: 1rem; font-size: 1.5rem; min-height: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>😀 Emoji Converter</h1>
        <div class="panel">
            <label>Type with :shortcode: or emoji</label>
            <textarea id="input" placeholder="Try: :smile: :heart: 🚀 or type hello world"></textarea>
            <div class="buttons">
                <button onclick="toEmoji()">To Emoji 😃</button>
                <button onclick="toCode()">To Shortcode :a:</button>
                <button class="secondary" onclick="copyResult()">Copy</button>
            </div>
            <label>Result</label>
            <div id="output" class="result"></div>
        </div>
    </div>
    <script>
        const shortcodes = {
            'smile': '😄', 'smile_cat': '😸', 'heart': '❤️', 'red_heart': '❤️',
            'thumbsup': '👍', 'thumbs_up': '👍', 'rocket': '🚀', 'fire': '🔥',
            'check': '✅', 'white_check_mark': '✅', 'x': '❌', 'cross_mark': '❌',
            'star': '⭐', 'star2': '🌟', 'sun': '☀️', 'moon': '🌙',
            'cloud': '☁️', 'rain': '🌧️', 'snow': '❄️', 'zap': '⚡',
            'bolt': '⚡', 'wave': '👋', 'wave_hand': '👋', 'ok_hand': '👌',
            'point_up': '☝️', 'v': '✌️', 'clap': '👏', 'pray': '🙏',
            'muscle': '💪', 'ear': '👂', 'eye': '👁️', 'brain': '🧠',
            'robot': '🤖', 'alien': '👽', 'ghost': '👻', 'skull': '💀',
            'cat': '🐱', 'dog': '🐶', 'mouse': '🐭', 'bird': '🐦',
            'fish': '🐟', ' bee': '🐝', 'bug': '🐛', 'snake': '🐍',
            'horse': '🐴', 'monkey': '🐵', 'chicken': '🐔', 'penguin': '🐧',
            'wolf': '🐺', 'tiger': '🐯', 'lion': '🦁', 'cow': '🐮',
            'pig': '🐷', 'frog': '🐸', 'dragon': '🐉', 'unicorn': '🦄',
            'apple': '🍎', 'banana': '🍌', 'grapes': '🍇', 'watermelon': '🍉',
            'pizza': '🍕', 'burger': '🍔', 'fries': '🍟', 'hotdog': '🌭',
            'cake': '🍰', 'coffee': '☕', 'beer': '🍺', 'wine': '🍷',
            'cocktail': '🍸', 'tea': '🍵', 'sake': '🍶', ' champagne': '🍾',
            'birthday': '🎂', 'gift': '🎁', 'balloon': '🎈', 'tada': '🎉',
            'confetti': '🎊', 'music': '🎵', 'guitar': '🎸', 'piano': '🎹',
            'film': '🎬', 'movie': '🎬', 'game': '🎮', 'dice': '🎲',
            'sports': '⚽', 'football': '⚽', 'basketball': '🏀', 'baseball': '⚾',
            'tennis': '🎾', 'golf': '⛳', 'medal': '🏅', 'trophy': '🏆',
            'crown': '👑', 'ring': '💍', 'dollar': '💵', 'money': '💰',
            'phone': '📱', 'computer': '💻', 'tv': '📺', 'camera': '📷',
            'book': '📖', 'pencil': '✏️', 'pen': '🖊️', 'scissors': '✂️',
            'key': '🔑', 'lock': '🔒', 'unlock': '🔓', 'hammer': '🔨',
            'wrench': '🔧', 'gear': '⚙️', 'bomb': '💣', 'knife': '🔪',
            'flag': '🚩', 'map': '🗺️', 'house': '🏠', 'school': '🏫',
            'hospital': '🏥', 'hotel': '🏨', 'factory': '🏭', 'church': '⛪',
            'moon_circle': '🌝', 'new_moon': '🌑', 'full_moon': '🌕'
        };
        const reverseCodes = Object.entries(shortcodes).reduce((acc, [k, v]) => {
            acc[v] = ':' + k + ':'; return acc;
        }, {});

        function toEmoji() {
            let text = document.getElementById('input').value;
            text = text.replace(/:([a-z_0-9]+):/g, (_, code) => shortcodes[code] || ':' + code + ':');
            document.getElementById('output').textContent = text;
        }
        function toCode() {
            let text = document.getElementById('input').value;
            for (let [code, emoji] of Object.entries(shortcodes)) {
                text = text.split(emoji).join(':' + code + ':');
            }
            document.getElementById('output').textContent = text;
        }
        function copyResult() {
            const text = document.getElementById('output').textContent;
            if (text) navigator.clipboard.writeText(text);
        }
    </script>
</body>
</html>
