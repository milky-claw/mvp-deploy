<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cron Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 2rem; color: #a8ff78; }
    .card { background: #16213e; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    select { width: 100%; padding: 0.75rem; border: 2px solid #0f3460; border-radius: 8px; background: #0f3460; color: #fff; font-size: 14px; margin-bottom: 1rem; }
    .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
    .row label { grid-column: 1 / -1; }
    .field-group { background: #0f3460; padding: 1rem; border-radius: 8px; }
    .cron-output { background: #0f3460; padding: 1.5rem; border-radius: 8px; text-align: center; font-family: monospace; font-size: 24px; color: #a8ff78; margin-top: 1rem; }
    .description { color: #aaa; font-size: 14px; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏰ Cron Generator</h1>
    <div class="card">
      <div class="field-group">
        <label>Minute (0-59)</label>
        <select id="minute">
          <option value="*">Every minute (*)</option>
          <option value="0">At minute 0</option>
          <option value="*/5">Every 5 minutes</option>
          <option value="*/15">Every 15 minutes</option>
          <option value="*/30">Every 30 minutes</option>
        </select>
      </div>
      <div class="field-group">
        <label>Hour (0-23)</label>
        <select id="hour">
          <option value="*">Every hour (*)</option>
          <option value="0">Midnight (0)</option>
          <option value="9">9 AM</option>
          <option value="12">Noon (12)</option>
          <option value="18">6 PM</option>
          <option value="*/2">Every 2 hours</option>
        </select>
      </div>
      <div class="field-group">
        <label>Day of Month (1-31)</label>
        <select id="dom">
          <option value="*">Every day (*)</option>
          <option value="1">1st of month</option>
          <option value="15">15th of month</option>
          <option value="1,15">1st and 15th</option>
        </select>
      </div>
      <div class="field-group">
        <label>Month (1-12)</label>
        <select id="month">
          <option value="*">Every month (*)</option>
          <option value="1">January</option>
          <option value="6">June</option>
          <option value="12">December</option>
        </select>
      </div>
      <div class="field-group">
        <label>Day of Week (0-6)</label>
        <select id="dow">
          <option value="*">Every day (*)</option>
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
          <option value="5">Friday</option>
          <option value="0,6">Weekends</option>
          <option value="1-5">Weekdays</option>
        </select>
      </div>
      <div class="cron-output" id="cronExpr">* * * * *</div>
      <p class="description" id="desc">Runs every minute</p>
    </div>
  </div>
  <script>
    const fields = ['minute', 'hour', 'dom', 'month', 'dow'];
    
    function updateCron() {
      const values = fields.map(f => document.getElementById(f).value);
      const cron = values.join(' ');
      document.getElementById('cronExpr').textContent = cron;
      document.getElementById('desc').textContent = getDescription(values);
    }
    
    function getDescription([min, hr, dom, mon, dow]) {
      if (min === '*' && hr === '*' && dom === '*' && mon === '*' && dow === '*') {
        return 'Runs every minute';
      }
      if (min === '0' && hr === '9' && dom === '*' && mon === '*' && dow === '1-5') {
        return 'Runs at 9 AM every weekday';
      }
      if (min === '*/5' && hr === '*') {
        return 'Runs every 5 minutes';
      }
      return 'Custom schedule';
    }
    
    fields.forEach(f => document.getElementById(f).addEventListener('change', updateCron));
    
    // Expose for testing
    window.getCronExpression = () => fields.map(f => document.getElementById(f).value).join(' ');
  </script>
</body>
</html>
