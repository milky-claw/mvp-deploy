<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP 112: Base64 Test</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 2rem auto; padding: 1rem; background: #1a1a2e; color: #eee; }
    h1 { color: #00d4ff; }
    .test { background: #16213e; padding: 1rem; margin: 0.5rem 0; border-radius: 8px; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    textarea { width: 100%; height: 80px; background: #0f0f23; color: #fff; border: 1px solid #333; padding: 0.5rem; }
    button { background: #00d4ff; color: #000; border: none; padding: 0.5rem 1rem; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🧪 MVP 112: Base64 Test CLI</h1>
  <div id="results"></div>
  <hr>
  <h3>Try it:</h3>
  <textarea id="input" placeholder="Enter text to encode/decode"></textarea>
  <button onclick="test()">Encode → Decode</button>
  <pre id="output"></pre>
  <script>
    const testCases = [
      { input: "Hello", expected: "SGVsbG8=" },
      { input: "World", expected: "V29ybGQ=" },
      { input: "" },
      { input: "Test 123!@#" },
      { input: "日本語" },
      { input: "🚀" }
    ];
    const results = document.getElementById('results');
    let passed = 0;
    testCases.forEach((tc, i) => {
      const encoded = btoa(unescape(encodeURIComponent(tc.input)));
      const decoded = decodeURIComponent(escape(atob(encoded)));
      const ok = decoded === tc.input;
      if (ok) passed++;
      results.innerHTML += `<div class="test">${ok ? '✅' : '❌'} "${tc.input}" → "${encoded}"</div>`;
    });
    results.innerHTML = `<h3>📊 ${passed}/${testCases.length} passed</h3>` + results.innerHTML;
    function test() {
      const input = document.getElementById('input').value;
      const encoded = btoa(unescape(encodeURIComponent(input)));
      document.getElementById('output').textContent = 'Encoded: ' + encoded + '\nDecoded: ' + input;
    }
  </script>
</body>
</html>
