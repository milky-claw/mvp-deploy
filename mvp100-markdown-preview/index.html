<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Preview</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; color: #00d9ff; }
    .container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; height: calc(100vh - 100px); }
    .panel { flex: 1; display: flex; flex-direction: column; }
    .panel h2 { margin-bottom: 10px; font-size: 1.1rem; color: #888; }
    textarea, .preview { flex: 1; background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; font-size: 14px; resize: none; }
    .preview { overflow-y: auto; line-height: 1.6; }
    .preview h1, .preview h2, .preview h3 { color: #00d9ff; margin: 15px 0 10px; }
    .preview code { background: #0f3460; padding: 2px 6px; border-radius: 4px; }
    .preview pre { background: #0f3460; padding: 10px; border-radius: 4px; overflow-x: auto; }
    .preview blockquote { border-left: 3px solid #00d9ff; padding-left: 10px; color: #888; }
    .preview a { color: #00d9ff; }
    .preview ul, .preview ol { margin-left: 20px; }
    .preview img { max-width: 100%; }
  </style>
</head>
<body>
  <h1>📝 Markdown Preview</h1>
  <div class="container">
    <div class="panel">
      <h2>Markdown Input</h2>
      <textarea id="input" placeholder="Type markdown here..."># Hello World

## Features
- Live preview
- Supports **bold** and *italic*
- Lists, code blocks, and more!

```javascript
console.log('Hello');
```

> Blockquote test
</textarea>
    </div>
    <div class="panel">
      <h2>HTML Preview</h2>
      <div class="preview" id="output"></div>
    </div>
  </div>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    marked.setOptions({ breaks: true, gfm: true });
    function render() { output.innerHTML = marked.parse(input.value); }
    input.addEventListener('input', render);
    render();
  </script>
</body>
</html>
