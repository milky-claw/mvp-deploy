<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base32 Encoder/Decoder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; color: #00d4ff; }
    .card { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
    textarea, input { width: 100%; padding: 12px; border: 2px solid #0f3460; border-radius: 8px; background: #0f3460; color: #fff; font-family: monospace; font-size: 14px; }
    textarea { height: 120px; resize: vertical; }
    textarea:focus, input:focus { outline: none; border-color: #00d4ff; }
    .btn-group { display: flex; gap: 10px; margin-top: 12px; }
    button { flex: 1; padding: 12px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-encode { background: #00d4ff; color: #1a1a2e; }
    .btn-encode:hover { background: #00b8e6; }
    .btn-decode { background: #e94560; color: #fff; }
    .btn-decode:hover { background: #d63d56; }
    .btn-copy { background: #0f3460; color: #00d4ff; border: 2px solid #00d4ff; }
    .btn-copy:hover { background: #00d4ff; color: #1a1a2e; }
    .result { margin-top: 16px; padding: 16px; background: #0a0a1a; border-radius: 8px; min-height: 60px; word-break: break-all; }
    .result:empty { display: none; }
    .error { color: #e94560; }
    .success { color: #00ff88; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔢 Base32 Encoder/Decoder</h1>
    <div class="card">
      <label>Input Text</label>
      <textarea id="input" placeholder="Enter text to encode or Base32 string to decode..."></textarea>
      <div class="btn-group">
        <button class="btn-encode" onclick="encode()">Encode</button>
        <button class="btn-decode" onclick="decode()">Decode</button>
      </div>
    </div>
    <div class="card">
      <label>Output</label>
      <div class="result" id="output"></div>
      <div class="btn-group">
        <button class="btn-copy" onclick="copyOutput()">Copy Result</button>
      </div>
    </div>
  </div>
  <script>
    const base32Chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    
    function encode() {
      try {
        const input = document.getElementById('input').value;
        if (!input) return setError('Please enter text');
        
        let bits = '';
        for (let i = 0; i < input.length; i++) {
          bits += input.charCodeAt(i).toString(2).padStart(8, '0');
        }
        
        let result = '';
        for (let i = 0; i + 5 <= bits.length; i += 5) {
          result += base32Chars[parseInt(bits.substr(i, 5), 2)];
        }
        
        const remaining = bits.length % 5;
        if (remaining > 0) {
          result += base32Chars[parseInt(bits.substr(bits.length - remaining) + '0'.repeat(5 - remaining), 2)];
        }
        
        setOutput(result);
      } catch (e) {
        setError(e.message);
      }
    }

    function decode() {
      try {
        const input = document.getElementById('input').value.toUpperCase().replace(/[^A-Z2-7]/g, '');
        if (!input) return setError('Please enter Base32 string');
        
        let bits = '';
        for (let i = 0; i < input.length; i++) {
          const val = base32Chars.indexOf(input[i]);
          if (val === -1) continue;
          bits += val.toString(2).padStart(5, '0');
        }
        
        let result = '';
        for (let i = 0; i + 8 <= bits.length; i += 8) {
          result += String.fromCharCode(parseInt(bits.substr(i, 8), 2));
        }
        
        setOutput(result);
      } catch (e) {
        setError('Invalid Base32 string');
      }
    }

    function setOutput(text) {
      const out = document.getElementById('output');
      out.textContent = text;
      out.className = 'result success';
    }

    function setError(msg) {
      const out = document.getElementById('output');
      out.textContent = msg;
      out.className = 'result error';
    }

    function copyOutput() {
      const text = document.getElementById('output').textContent;
      if (text) navigator.clipboard.writeText(text);
    }
  </script>
</body>
</html>
