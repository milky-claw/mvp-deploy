<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP 113: JWT Test</title>
  <style>
    body { font-family: system-ui; max-width: 700px; margin: 2rem auto; padding: 1rem; background: #1a1a2e; color: #eee; }
    h1 { color: #f472b6; }
    .test { background: #16213e; padding: 1rem; margin: 0.5rem 0; border-radius: 8px; font-family: monospace; font-size: 14px; }
    .token { color: #fbbf24; word-break: break-all; }
    .header { color: #60a5fa; }
    .payload { color: #4ade80; }
    .status { font-weight: bold; }
    textarea { width: 100%; height: 60px; background: #0f0f23; color: #fff; border: 1px solid #333; padding: 0.5rem; }
    button { background: #f472b6; color: #000; border: none; padding: 0.5rem 1rem; cursor: pointer; font-weight: bold; }
    pre { background: #0f0f23; padding: 1rem; overflow-x: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🧪 MVP 113: JWT Test CLI</h1>
  <div id="results"></div>
  <hr>
  <h3>Decode JWT:</h3>
  <textarea id="input" placeholder="Paste JWT token here"></textarea>
  <button onclick="decode()">Decode</button>
  <pre id="output"></pre>
  <script>
    function b64url(s) { return s.replace(/-/g, '+').replace(/_/g, '/').padEnd(s.length + (4 - s.length % 4) % 4, '='); }
    function decodeJWT(token) {
      const p = token.split('.');
      if (p.length !== 3) return null;
      try {
        return { header: JSON.parse(atob(b64url(p[0]))), payload: JSON.parse(atob(b64url(p[1]))), sig: p[2] };
      } catch { return null; }
    }
    const testTokens = [
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
    ];
    const results = document.getElementById('results');
    testTokens.forEach(t => {
      const d = decodeJWT(t);
      results.innerHTML += `<div class="test"><span class="token">${t.substring(0,50)}...</span><br><span class="header">Header:</span> ${JSON.stringify(d.header)}<br><span class="payload">Payload:</span> ${JSON.stringify(d.payload)}</div>`;
    });
    function decode() {
      const t = document.getElementById('input').value.trim();
      const d = decodeJWT(t);
      document.getElementById('output').textContent = d ? JSON.stringify(d, null, 2) : 'Invalid JWT';
    }
  </script>
</body>
</html>
