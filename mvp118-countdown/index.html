<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f0f0f; color: #fff; padding: 20px; }
    h1 { margin-bottom: 30px; font-weight: 300; letter-spacing: 2px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
    input { padding: 12px 16px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 16px; width: 120px; text-align: center; }
    input:focus { outline: none; border-color: #00d4ff; }
    .buttons { display: flex; gap: 10px; margin-bottom: 30px; }
    button { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.2s; }
    .btn-start { background: #00d4ff; color: #000; }
    .btn-start:hover { background: #00b8e6; }
    .btn-stop { background: #ff4757; color: #fff; }
    .btn-stop:hover { background: #e8414f; }
    .btn-reset { background: #333; color: #fff; }
    .btn-reset:hover { background: #444; }
    .display { font-size: 72px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 4px; }
    .display.hidden { display: none; }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    .preset { padding: 8px 16px; background: #222; border: 1px solid #333; border-radius: 20px; color: #888; cursor: pointer; font-size: 14px; }
    .preset:hover { border-color: #00d4ff; color: #00d4ff; }
  </style>
</head>
<body>
  <h1>⏱️ COUNTDOWN</h1>
  <div class="input-group">
    <input type="number" id="hours" placeholder="Hrs" min="0" value="0">
    <input type="number" id="minutes" placeholder="Min" min="0" value="5">
    <input type="number" id="seconds" placeholder="Sec" min="0" value="0">
  </div>
  <div class="buttons">
    <button class="btn-start" onclick="startTimer()">Start</button>
    <button class="btn-stop" onclick="stopTimer()">Stop</button>
    <button class="btn-reset" onclick="resetTimer()">Reset</button>
  </div>
  <div class="display" id="display">00:00:00</div>
  <div class="presets">
    <button class="preset" onclick="setPreset(1)">1 min</button>
    <button class="preset" onclick="setPreset(5)">5 min</button>
    <button class="preset" onclick="setPreset(15)">15 min</button>
    <button class="preset" onclick="setPreset(30)">30 min</button>
    <button class="preset" onclick="setPreset(60)">1 hour</button>
  </div>
  <script>
    let interval = null;
    let totalSeconds = 0;
    let remaining = 0;
    const display = document.getElementById('display');

    function updateDisplay(secs) {
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      display.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function getInputSeconds() {
      const h = parseInt(document.getElementById('hours').value) || 0;
      const m = parseInt(document.getElementById('minutes').value) || 0;
      const s = parseInt(document.getElementById('seconds').value) || 0;
      return h * 3600 + m * 60 + s;
    }

    function startTimer() {
      if (interval) return;
      totalSeconds = getInputSeconds();
      if (totalSeconds <= 0) return;
      remaining = totalSeconds;
      updateDisplay(remaining);
      interval = setInterval(() => {
        remaining--;
        updateDisplay(remaining);
        if (remaining <= 0) {
          stopTimer();
          display.textContent = "⏰ DONE!";
          new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2teleW4fP5/r25ppfR0kW+Lp2oZGFQQ1ouHjm2IcCBaJ'.repeat(1)).play().catch(()=>{});
        }
      }, 1000);
    }

    function stopTimer() {
      if (interval) clearInterval(interval);
      interval = null;
    }

    function resetTimer() {
      stopTimer();
      updateDisplay(totalSeconds || 0);
    }

    function setPreset(mins) {
      stopTimer();
      document.getElementById('hours').value = Math.floor(mins / 60);
      document.getElementById('minutes').value = mins % 60;
      document.getElementById('seconds').value = 0;
      updateDisplay(mins * 60);
    }

    // Initialize
    updateDisplay(300);
  </script>
</body>
</html>
