<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Tool</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 1100px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee; }
    h1 { color: #00d4ff; }
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    label { font-weight: bold; color: #00d4ff; display: block; margin-bottom: 5px; }
    textarea { width: 100%; padding: 12px; border: 2px solid #333; border-radius: 8px; background: #16213e; color: #fff; font-family: monospace; font-size: 14px; min-height: 200px; resize: vertical; }
    .output { background: #16213e; padding: 15px; border-radius: 8px; min-height: 200px; font-family: monospace; white-space: pre-wrap; overflow-x: auto; }
    button { padding: 10px 20px; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 10px 0; }
    button:hover { background: #00b8e6; }
    .diff-add { background: rgba(40, 167, 69, 0.3); color: #28a745; }
    .diff-remove { background: rgba(255, 107, 107, 0.3); color: #ff6b6b; }
    .diff-equal { color: #888; }
  </style>
</head>
<body>
  <h1>📈 Diff Tool</h1>
  <p>Compare two texts and see the differences.</p>
  <div class="container">
    <div>
      <label>Original Text</label>
      <textarea id="text1" placeholder="Enter original text...">Hello World
This is line 2
Line 3 here</textarea>
    </div>
    <div>
      <label>Modified Text</label>
      <textarea id="text2" placeholder="Enter modified text...">Hello World
This is modified
Line 4 added</textarea>
    </div>
  </div>
  <button onclick="diff()">Compare</button>
  <div class="output" id="output">Differences will appear here...</div>
  
  <script>
    function diff() {
      const t1 = document.getElementById('text1').value.split('\n');
      const t2 = document.getElementById('text2').value.split('\n');
      const output = document.getElementById('output');
      
      // Simple line-by-line diff
      const maxLines = Math.max(t1.length, t2.length);
      let result = '';
      
      for (let i = 0; i < maxLines; i++) {
        const l1 = t1[i] || '';
        const l2 = t2[i] || '';
        
        if (l1 === l2) {
          result += `<div class="diff-equal">  ${escapeHtml(l1)}</div>`;
        } else if (!l1 && l2) {
          result += `<div class="diff-add">+ ${escapeHtml(l2)}</div>`;
        } else if (l1 && !l2) {
          result += `<div class="diff-remove">- ${escapeHtml(l1)}</div>`;
        } else {
          result += `<div class="diff-remove">- ${escapeHtml(l1)}</div>`;
          result += `<div class="diff-add">+ ${escapeHtml(l2)}</div>`;
        }
      }
      
      output.innerHTML = result || '<div class="diff-equal">No differences (or empty input)</div>';
    }
    
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
