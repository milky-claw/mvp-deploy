<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hash Verifier</title>
  <script src="https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 32px; max-width: 500px; width: 100%; }
    h1 { color: #333; margin-bottom: 24px; text-align: center; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #555; font-weight: 500; }
    textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: monospace; min-height: 80px; resize: vertical; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .btn { background: #28a745; color: white; border: none; padding: 14px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 12px; }
    .btn:hover { background: #218838; }
    #result { margin-top: 20px; padding: 16px; border-radius: 8px; display: none; }
    #result.match { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
    #result.mismatch { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    .hash-preview { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Hash Verifier</h1>
    <div class="field">
      <label>Enter Text to Verify:</label>
      <textarea id="textInput" placeholder="Paste text or file content here..."></textarea>
    </div>
    <div class="field">
      <label>Expected Hash:</label>
      <input type="text" id="hashInput" placeholder="Paste expected hash here...">
    </div>
    <div class="field">
      <label>Algorithm:</label>
      <select id="algo">
        <option value="md5">MD5</option>
        <option value="sha1">SHA-1</option>
        <option value="sha256" selected>SHA-256</option>
        <option value="sha384">SHA-384</option>
        <option value="sha512">SHA-512</option>
      </select>
    </div>
    <button class="btn" onclick="verify()">Verify Hash</button>
    <div id="result"></div>
  </div>
  <script>
    async function verify() {
      const text = document.getElementById('textInput').value;
      const expectedHash = document.getElementById('hashInput').value.trim().toLowerCase();
      const algo = document.getElementById('algo').value;
      const result = document.getElementById('result');
      
      if (!text || !expectedHash) {
        result.className = 'mismatch';
        result.textContent = 'Please enter both text and hash';
        result.style.display = 'block';
        return;
      }

      let computedHash = '';
      const encoder = new TextEncoder();
      const data = encoder.encode(text);

      if (algo === 'md5') {
        computedHash = md5(text);
      } else {
        const hashBuffer = await crypto.subtle.digest(algo.toUpperCase().replace('SHA', 'SHA-'), data);
        computedHash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }

      if (computedHash === expectedHash) {
        result.className = 'match';
        result.innerHTML = `✅ <strong>Match!</strong><br>Computed ${algo.toUpperCase()}: ${computedHash}`;
      } else {
        result.className = 'mismatch';
        result.innerHTML = `❌ <strong>No Match!</strong><br>Expected: ${expectedHash}<br>Computed: ${computedHash}`;
      }
      result.style.display = 'block';
    }
  </script>
</body>
</html>
