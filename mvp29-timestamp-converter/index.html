<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timestamp Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    h1 { margin-bottom: 1.5rem; color: #e94560; }
    .container { width: 100%; max-width: 500px; }
    .card { background: #16213e; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #aaa; }
    input { width: 100%; padding: 0.75rem; border: 2px solid #333; border-radius: 8px; background: #0f0f23; color: #eee; font-size: 1rem; font-family: monospace; }
    input:focus { outline: none; border-color: #e94560; }
    button { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; background: #e94560; color: #fff; font-weight: bold; margin-top: 1rem; }
    button:hover { opacity: 0.9; }
    .output { margin-top: 1rem; padding: 1rem; background: #0f0f23; border-radius: 8px; word-break: break-all; font-family: monospace; }
    .output-label { color: #888; font-size: 0.875rem; }
    .output-value { color: #00d9ff; font-size: 1.125rem; margin-top: 0.25rem; }
    .now-btn { background: #333; margin-top: 0.5rem; }
    .info { font-size: 0.875rem; color: #666; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🕐 Timestamp Converter</h1>
    
    <div class="card">
      <label>Unix Timestamp (seconds)</label>
      <input type="text" id="timestamp" placeholder="e.g., 1768435200">
      <button class="now-btn" onclick="setNow()">Now</button>
      <div class="output">
        <div class="output-label">Human Readable</div>
        <div class="output-value" id="dateOutput">—</div>
      </div>
    </div>

    <div class="card">
      <label>Date & Time</label>
      <input type="datetime-local" id="datetime">
      <div class="output">
        <div class="output-label">Unix Timestamp</div>
        <div class="output-value" id="tsOutput">—</div>
      </div>
    </div>

    <div class="card">
      <label>Quick Convert</label>
      <button onclick="convertBoth()">Convert Bidirectional</button>
      <p class="info">Convert both ways at once</p>
    </div>
  </div>

  <script>
    const timestampInput = document.getElementById('timestamp');
    const datetimeInput = document.getElementById('datetime');
    const dateOutput = document.getElementById('dateOutput');
    const tsOutput = document.getElementById('tsOutput');

    function formatDate(ts) {
      return new Date(ts * 1000).toLocaleString('en-US', { 
        weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', 
        hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' 
      });
    }

    timestampInput.addEventListener('input', () => {
      const ts = parseInt(timestampInput.value);
      if (!isNaN(ts)) {
        dateOutput.textContent = formatDate(ts);
      } else {
        dateOutput.textContent = '—';
      }
    });

    datetimeInput.addEventListener('change', () => {
      const date = new Date(datetimeInput.value);
      if (!isNaN(date.getTime())) {
        const ts = Math.floor(date.getTime() / 1000);
        tsOutput.textContent = ts;
      } else {
        tsOutput.textContent = '—';
      }
    });

    function setNow() {
      const now = Math.floor(Date.now() / 1000);
      timestampInput.value = now;
      timestampInput.dispatchEvent(new Event('input'));
    }

    function convertBoth() {
      const ts = parseInt(timestampInput.value);
      if (!isNaN(ts)) {
        dateOutput.textContent = formatDate(ts);
        const date = new Date(ts * 1000);
        datetimeInput.value = date.toISOString().slice(0, 16);
      }
      const dateStr = datetimeInput.value;
      if (dateStr) {
        const date = new Date(dateStr);
        if (!isNaN(date.getTime())) {
          const ts = Math.floor(date.getTime() / 1000);
          tsOutput.textContent = ts;
        }
      }
    }

    // Initialize with current time
    setNow();
  </script>
</body>
</html>
