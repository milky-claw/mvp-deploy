<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; text-align: center; }
    h1 { color: #ffd93d; margin-bottom: 1rem; }
    .input-group { background: #16213e; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
    textarea { width: 100%; background: #0f3460; border: 1px solid #ffd93d; color: #fff; padding: 1rem; border-radius: 8px; font-size: 16px; min-height: 80px; margin-bottom: 1rem; }
    button { background: #ffd93d; color: #1a1a2e; border: none; padding: 0.8rem 2rem; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
    button:hover { background: #ffc107; }
    .qr-output { background: #fff; padding: 1.5rem; border-radius: 12px; display: inline-block; }
    .qr-output img { max-width: 300px; }
    .download-link { display: block; margin-top: 1rem; color: #1a1a2e; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔳 QR Code Generator</h1>
    <div class="input-group">
      <textarea id="text" placeholder="Enter URL or text...">https://example.com</textarea>
      <br>
      <button onclick="generateQR()">Generate QR Code</button>
    </div>
    <div class="qr-output" id="output">
      <img id="qr-img" src="" alt="QR Code" style="display:none">
    </div>
    <a id="download" class="download-link" download="qrcode.png" style="display:none">📥 Download PNG</a>
  </div>
  <script>
    function generateQR() {
      const text = document.getElementById('text').value.trim();
      if (!text) return;
      
      const encoded = encodeURIComponent(text);
      const url = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encoded}`;
      
      const img = document.getElementById('qr-img');
      img.src = url;
      img.style.display = 'inline-block';
      
      const dl = document.getElementById('download');
      dl.href = url;
      dl.style.display = 'block';
    }
    
    generateQR();
  </script>
</body>
</html>
