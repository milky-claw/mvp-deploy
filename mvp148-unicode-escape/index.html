<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode Escape/Unescape</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 2rem; color: #00d9ff; }
        .panel { background: #16213e; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.9rem; }
        textarea { width: 100%; height: 150px; background: #0f0f23; border: 1px solid #333; border-radius: 8px; color: #fff; padding: 1rem; font-family: monospace; font-size: 1rem; resize: vertical; }
        textarea:focus { outline: none; border-color: #00d9ff; }
        .buttons { display: flex; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
        button { background: #00d9ff; color: #1a1a2e; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button.secondary { background: #333; color: #fff; }
        .result { background: #0f0f23; border: 1px solid #00d9ff33; border-radius: 8px; padding: 1rem; font-family: monospace; min-height: 100px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔁 Unicode Escape/Unescape</h1>
        <div class="panel">
            <label>Input Text</label>
            <textarea id="input" placeholder="Enter text to escape or unescape..."></textarea>
            <div class="buttons">
                <button onclick="escape()">Escape → \uXXXX</button>
                <button onclick="unescape()">Unescape → Text</button>
                <button class="secondary" onclick="clearAll()">Clear</button>
            </div>
            <label>Result</label>
            <div id="output" class="result"></div>
        </div>
    </div>
    <script>
        function escape() {
            const input = document.getElementById('input').value;
            let result = '';
            for (let i = 0; i < input.length; i++) {
                const code = input.charCodeAt(i);
                if (code > 127) {
                    result += '\\u' + code.toString(16).padStart(4, '0');
                } else {
                    result += input[i];
                }
            }
            document.getElementById('output').textContent = result;
        }
        function unescape() {
            const input = document.getElementById('input').value;
            const result = input.replace(/\\u([0-9a-fA-F]{4})/g, (_, code) => String.fromCharCode(parseInt(code, 16)));
            document.getElementById('output').textContent = result;
        }
        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = '';
        }
    </script>
</body>
</html>
