<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Minifier</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; color: #00d9ff; }
    .panels { display: flex; gap: 20px; flex-wrap: wrap; }
    .panel { flex: 1; min-width: 300px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    textarea { width: 100%; height: 400px; background: #16213e; border: 1px solid #0f3460; color: #eee; padding: 15px; font-family: 'Monaco', 'Menlo', monospace; font-size: 13px; border-radius: 8px; resize: vertical; }
    textarea:focus { outline: none; border-color: #00d9ff; }
    .buttons { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: transform 0.1s; }
    button:hover { transform: scale(1.02); }
    .btn-primary { background: #00d9ff; color: #1a1a2e; }
    .btn-secondary { background: #e94560; color: #fff; }
    .btn-copy { background: #0f3460; color: #eee; }
    .error { color: #e94560; margin-top: 10px; display: none; }
    .stats { color: #888; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 JSON Minifier</h1>
    <div class="panels">
      <div class="panel">
        <label>Input JSON</label>
        <textarea id="input" placeholder='{"key": "value", "array": [1,2,3]}'></textarea>
        <div class="buttons">
          <button class="btn-primary" onclick="minify()">Minify</button>
          <button class="btn-primary" onclick="beautify()">Beautify</button>
          <button class="btn-secondary" onclick="clearAll()">Clear</button>
          <button class="btn-copy" onclick="copyOutput()">Copy Output</button>
        </div>
        <div class="error" id="error"></div>
      </div>
      <div class="panel">
        <label>Output</label>
        <textarea id="output" readonly></textarea>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const error = document.getElementById('error');
    const stats = document.getElementById('stats');

    function showError(msg) {
      error.textContent = msg;
      error.style.display = msg ? 'block' : 'none';
      output.value = '';
      stats.textContent = '';
    }

    function parseJSON() {
      const val = input.value.trim();
      if (!val) return null;
      try { return JSON.parse(val); }
      catch (e) { showError('Invalid JSON: ' + e.message); return null; }
    }

    function minify() {
      error.style.display = 'none';
      const json = parseJSON();
      if (!json) return;
      const minified = JSON.stringify(json);
      output.value = minified;
      updateStats(input.value.length, minified.length);
    }

    function beautify() {
      error.style.display = 'none';
      const json = parseJSON();
      if (!json) return;
      const beautified = JSON.stringify(json, null, 2);
      output.value = beautified;
      updateStats(input.value.length, beautified.length);
    }

    function clearAll() {
      input.value = '';
      output.value = '';
      error.style.display = 'none';
      stats.textContent = '';
    }

    function copyOutput() {
      if (!output.value) return;
      navigator.clipboard.writeText(output.value);
    }

    function updateStats(inLen, outLen) {
      const reduction = inLen ? Math.round((1 - outLen / inLen) * 100) : 0;
      stats.textContent = `Input: ${inLen} chars → Output: ${outLen} chars (${reduction}% reduction)`;
    }
  </script>
</body>
</html>
