<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; background: #1a1a2e; color: #fff; padding: 40px 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; font-weight: 300; letter-spacing: 2px; }
    textarea { width: 100%; height: 200px; padding: 20px; border: 1px solid #333; border-radius: 12px; background: #16213e; color: #fff; font-size: 16px; resize: vertical; }
    textarea:focus { outline: none; border-color: #e94560; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
    .stat { background: #0f3460; padding: 20px; border-radius: 12px; text-align: center; }
    .stat-value { font-size: 32px; font-weight: 700; color: #e94560; }
    .stat-label { font-size: 14px; color: #888; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .checker { margin-top: 30px; padding: 20px; background: #0f3460; border-radius: 12px; }
    .checker h3 { margin-bottom: 15px; color: #888; font-weight: 400; }
    .check-items { display: flex; flex-wrap: wrap; gap: 10px; }
    .check-item { padding: 8px 16px; background: #16213e; border-radius: 20px; font-size: 14px; }
    .check-item.pass { border: 1px solid #00d4ff; color: #00d4ff; }
    .check-item.fail { border: 1px solid #e94560; color: #e94560; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Character Counter</h1>
    <textarea id="input" placeholder="Paste or type your text here..."></textarea>
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="chars">0</div>
        <div class="stat-label">Characters</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="words">0</div>
        <div class="stat-label">Words</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="lines">0</div>
        <div class="stat-label">Lines</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="sentences">0</div>
        <div class="stat-label">Sentences</div>
      </div>
    </div>
    <div class="checker">
      <h3>Quick Checks</h3>
      <div class="check-items">
        <div class="check-item" id="check-empty">Empty</div>
        <div class="check-item" id="check-twitter">Twitter (280)</div>
        <div class="check-item" id="check-sms">SMS (160)</div>
        <div class="check-item" id="check-title">Title Case</div>
      </div>
    </div>
  </div>
  <script>
    const input = document.getElementById('input');
    const charsEl = document.getElementById('chars');
    const wordsEl = document.getElementById('words');
    const linesEl = document.getElementById('lines');
    const sentencesEl = document.getElementById('sentences');

    function update() {
      const text = input.value;
      const chars = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const lines = text ? text.split('\n').length : 0;
      const sentences = text ? text.split(/[.!?]+/).filter(s => s.trim()).length : 0;

      charsEl.textContent = chars;
      wordsEl.textContent = words;
      linesEl.textContent = lines;
      sentencesEl.textContent = sentences;

      // Checks
      const checkEmpty = document.getElementById('check-empty');
      checkEmpty.className = 'check-item ' + (chars === 0 ? 'fail' : 'pass');
      checkEmpty.textContent = chars === 0 ? 'Empty ✗' : 'Has Content ✓';

      const checkTwitter = document.getElementById('check-twitter');
      checkTwitter.className = 'check-item ' + (chars <= 280 ? 'pass' : 'fail');
      checkTwitter.textContent = `Twitter (${chars}/280)`;

      const checkSms = document.getElementById('check-sms');
      checkSms.className = 'check-item ' + (chars <= 160 ? 'pass' : 'fail');
      checkSms.textContent = `SMS (${chars}/160)`;

      const checkTitle = document.getElementById('check-title');
      const isTitleCase = text.length > 0 && text === text.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substr(1).toLowerCase());
      checkTitle.className = 'check-item ' + (isTitleCase ? 'pass' : 'fail');
      checkTitle.textContent = isTitleCase ? 'Title Case ✓' : 'Title Case ✗';
    }

    input.addEventListener('input', update);
    update();
  </script>
</body>
</html>
