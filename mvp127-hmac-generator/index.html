<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMAC Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 2rem; color: #00d9ff; }
    .card { background: #16213e; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.9rem; }
    input, textarea, select { width: 100%; padding: 0.75rem; background: #0f3460; border: 1px solid #1a1a2e; border-radius: 8px; color: #fff; font-family: monospace; font-size: 1rem; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #00d9ff; }
    button { width: 100%; padding: 1rem; background: linear-gradient(135deg, #00d9ff, #00a8cc); border: none; border-radius: 8px; color: #1a1a2e; font-weight: bold; cursor: pointer; margin-top: 1rem; }
    button:hover { transform: translateY(-2px); }
    .result { background: #0f3460; padding: 1rem; border-radius: 8px; word-break: break-all; font-family: monospace; margin-top: 1rem; }
    .copy-btn { background: #e94560; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 HMAC Generator</h1>
    
    <div class="card">
      <label>Message</label>
      <textarea id="message" rows="3" placeholder="Enter message..."></textarea>
    </div>
    
    <div class="card">
      <label>Secret Key</label>
      <input type="text" id="secret" placeholder="Enter secret key...">
    </div>
    
    <div class="card">
      <label>Algorithm</label>
      <select id="algo">
        <option value="SHA-256">HMAC-SHA256</option>
        <option value="SHA-384">HMAC-SHA384</option>
        <option value="SHA-512">HMAC-SHA512</option>
        <option value="SHA-1">HMAC-SHA1</option>
      </select>
    </div>
    
    <button onclick="generate()">Generate HMAC</button>
    
    <div class="result" id="result" style="display:none;"></div>
    <button class="copy-btn" onclick="copyResult()" style="display:none;" id="copyBtn">Copy to Clipboard</button>
  </div>

  <script>
    async function generate() {
      const msg = document.getElementById('message').value;
      const secret = document.getElementById('secret').value || 'secret';
      const algo = document.getElementById('algo').value;
      
      if (!msg) {
        alert('Please enter a message');
        return;
      }
      
      const encoder = new TextEncoder();
      const keyData = encoder.encode(secret);
      const msgData = encoder.encode(msg);
      
      const cryptoKey = await crypto.subtle.importKey(
        'raw', keyData,
        { name: 'HMAC', hash: algo },
        false, ['sign']
      );
      
      const signature = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
      const hashArray = Array.from(new Uint8Array(signature));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      
      const resultEl = document.getElementById('result');
      resultEl.textContent = hashHex;
      resultEl.style.display = 'block';
      document.getElementById('copyBtn').style.display = 'block';
    }
    
    function copyResult() {
      const text = document.getElementById('result').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied!');
      });
    }
  </script>
</body>
</html>
