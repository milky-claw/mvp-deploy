<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Reader - Scan QR Codes</title>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; color: #00d9ff; }
    .upload-box { border: 2px dashed #00d9ff; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .upload-box:hover { background: rgba(0,217,255,0.1); }
    .upload-box input { display: none; }
    .upload-icon { font-size: 48px; margin-bottom: 10px; }
    #reader { width: 100%; margin-top: 20px; border-radius: 12px; overflow: hidden; }
    .result { background: #16213e; border-radius: 12px; padding: 20px; margin-top: 20px; display: none; }
    .result.show { display: block; }
    .result h3 { color: #00d9ff; margin-bottom: 10px; }
    .result-content { background: #0f0f23; padding: 15px; border-radius: 8px; word-break: break-all; font-family: monospace; }
    .result-actions { margin-top: 15px; display: flex; gap: 10px; }
    .btn { background: #00d9ff; color: #1a1a2e; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #00b8d4; }
    .btn-secondary { background: #333; color: #fff; }
    .error { color: #ff6b6b; text-align: center; margin-top: 20px; }
    .history { margin-top: 30px; }
    .history h3 { margin-bottom: 15px; color: #aaa; }
    .history-item { background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 QR Code Reader</h1>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📁</div>
      <p>Click to upload QR code image</p>
      <p style="color: #888; font-size: 14px; margin-top: 8px;">or use camera</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="reader"></div>
    
    <div class="result" id="result">
      <h3>Decoded Content:</h3>
      <div class="result-content" id="resultContent"></div>
      <div class="result-actions">
        <button class="btn" onclick="copyResult()">Copy</button>
        <button class="btn btn-secondary" onclick="openUrl()">Open URL</button>
        <button class="btn btn-secondary" onclick="saveToHistory()">Save</button>
      </div>
    </div>

    <div class="error" id="error"></div>

    <div class="history" id="history">
      <h3>Recent Scans</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const resultDiv = document.getElementById('result');
    const resultContent = document.getElementById('resultContent');
    const errorDiv = document.getElementById('error');
    let lastResult = '';

    // Load history
    let history = JSON.parse(localStorage.getItem('qrHistory') || '[]');
    renderHistory();

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      try {
        const html5QrCode = new Html5Qrcode("reader");
        const result = await html5QrCode.scanFile(file, true);
        showResult(result);
      } catch (err) {
        errorDiv.textContent = 'Could not find QR code in image. Try a clearer image.';
      }
    });

    function showResult(text) {
      lastResult = text;
      resultContent.textContent = text;
      resultDiv.classList.add('show');
      errorDiv.textContent = '';
    }

    function copyResult() {
      navigator.clipboard.writeText(lastResult);
      alert('Copied!');
    }

    function openUrl() {
      if (lastResult.startsWith('http')) {
        window.open(lastResult, '_blank');
      } else {
        alert('Not a URL');
      }
    }

    function saveToHistory() {
      history.unshift({ text: lastResult, time: new Date().toLocaleString() });
      history = history.slice(0, 10);
      localStorage.setItem('qrHistory', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (history.length === 0) {
        list.innerHTML = '<p style="color: #666;">No scans yet</p>';
        return;
      }
      list.innerHTML = history.map(item => 
        `<div class="history-item" onclick="showResult('${item.text.replace(/'/g, "\\'")}')">${item.text}</div>`
      ).join('');
    }
  </script>
</body>
</html>
