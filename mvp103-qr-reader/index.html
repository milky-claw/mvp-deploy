<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Reader</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 32px; max-width: 500px; width: 100%; }
    h1 { color: #333; margin-bottom: 24px; text-align: center; }
    .drop-zone { border: 2px dashed #ccc; border-radius: 8px; padding: 40px 20px; text-align: center; cursor: pointer; transition: border-color 0.3s; margin-bottom: 20px; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #007bff; background: #f8f9fa; }
    .drop-zone p { color: #666; }
    #preview { max-width: 100%; max-height: 200px; margin: 20px 0; display: none; border-radius: 8px; }
    #result { background: #e7f3ff; border-radius: 8px; padding: 16px; margin-top: 20px; display: none; }
    #result h3 { color: #007bff; margin-bottom: 8px; }
    #result p { word-break: break-all; color: #333; }
    .btn { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; }
    .btn:hover { background: #0056b3; }
    input[type="file"] { display: none; }
    .error { background: #ffe7e7; color: #d00; padding: 12px; border-radius: 6px; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 QR Code Reader</h1>
    <div class="drop-zone" id="dropZone">
      <p>📁 Click or drag image here</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <img id="preview">
    <div id="error" class="error"></div>
    <div id="result">
      <h3>Decoded Content:</h3>
      <p id="resultText"></p>
    </div>
  </div>
  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const resultText = document.getElementById('resultText');
    const error = document.getElementById('error');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) processImage(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', e => { if (e.target.files.length) processImage(e.target.files[0]); });

    function processImage(file) {
      error.style.display = 'result.style.display = 'none';
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        preview.style.display = 'block';
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, canvas.width, canvas.height);
          if (code) {
            resultText.textContent = code.data;
            result.style.display = 'block';
            error.style.display = 'none';
          } else {
            error.textContent = 'No QR code found in image';
            error.style.display = 'block';
            result.style.display = 'none';
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
