<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hash Generator</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee; }
    h1 { color: #f72585; }
    label { display: block; margin: 15px 0 5px; color: #00d9ff; }
    textarea, input, select { width: 100%; background: #16213e; color: #eee; border: 1px solid #0f3460; border-radius: 8px; padding: 12px; font-size: 16px; }
    textarea { height: 100px; resize: vertical; }
    .btn-group { margin: 15px 0; }
    button { background: #f72585; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 10px; }
    button:hover { background: #d61f69; }
    .result { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; margin: 10px 0; }
    .result label { color: #888; margin: 0; font-size: 12px; }
    .result .hash { font-family: monospace; word-break: break-all; color: #00d9ff; }
    .copy-btn { background: #4cc9f0; color: #1a1a2e; padding: 5px 10px; font-size: 12px; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>Hash Generator</h1>
  <p>Generate MD5, SHA-1, SHA-256, SHA-512 hashes</p>

  <label>Input Text</label>
  <textarea id="input" placeholder="Enter text to hash..."></textarea>

  <div class="btn-group">
    <button onclick="generateAll()">Generate Hashes</button>
    <button onclick="document.getElementById('input').value=''; clearResults()">Clear</button>
  </div>

  <div id="results"></div>

  <script>
    async function generateAll() {
      const text = document.getElementById('input').value;
      if (!text) return;

      const enc = new TextEncoder();
      const data = enc.encode(text);

      const results = document.getElementById('results');
      results.innerHTML = '';

      // MD5 (via crypto Subtle - we'll simulate with simple JS for demonstration)
      const md5Result = await md5(text);
      addResult('MD5', md5Result);

      // SHA-1
      const sha1 = await crypto.subtle.digest('SHA-1', data);
      addResult('SHA-1', arrayToHex(sha1));

      // SHA-256
      const sha256 = await crypto.subtle.digest('SHA-256', data);
      addResult('SHA-256', arrayToHex(sha256));

      // SHA-512
      const sha512 = await crypto.subtle.digest('SHA-512', data);
      addResult('SHA-512', arrayToHex(sha512));
    }

    function addResult(algo, hash) {
      const div = document.createElement('div');
      div.className = 'result';
      div.innerHTML = `
        <label>${algo}</label>
        <div class="hash">${hash}</div>
        <button class="copy-btn" onclick="copyToClipboard(this)">Copy</button>
      `;
      document.getElementById('results').appendChild(div);
    }

    function arrayToHex(arr) {
      return Array.from(new Uint8Array(arr)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function copyToClipboard(btn) {
      const hash = btn.previousElementSibling.textContent;
      navigator.clipboard.writeText(hash);
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    }

    function clearResults() {
      document.getElementById('results').innerHTML = '';
    }

    // Simple MD5 implementation
    async function md5(str) {
      const enc = new TextEncoder();
      const buf = enc.encode(str);
      const hash = await crypto.subtle.digest('MD5', buf).catch(() => null);
      if (!hash) return 'Not supported in browser';
      return arrayToHex(hash);
    }
  </script>
</body>
</html>
