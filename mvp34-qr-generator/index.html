<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; color: #38bdf8; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1rem; margin-bottom: 1rem; }
    input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0ea5e9; }
    #qr-output { margin-top: 1.5rem; text-align: center; min-height: 200px; display: flex; align-items: center; justify-content: center; }
    #qr-output canvas { max-width: 100%; border-radius: 8px; }
    .placeholder { color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔳 QR Code Generator</h1>
    <input type="text" id="qr-input" placeholder="Enter text or URL..." autofocus>
    <button onclick="generateQR()">Generate QR Code</button>
    <div id="qr-output"><span class="placeholder">QR code will appear here</span></div>
  </div>
  <script>
    const input = document.getElementById('qr-input');
    const output = document.getElementById('qr-output');
    
    input.addEventListener('keypress', e => { if (e.key === 'Enter') generateQR(); });
    
    function generateQR() {
      const text = input.value.trim();
      if (!text) return;
      output.innerHTML = '';
      QRCode.toCanvas(document.createElement('canvas'), text, { width: 256, margin: 2, color: { dark: '#000000', light: '#ffffff' } }, (err, canvas) => {
        if (!err) output.appendChild(canvas);
      });
    }
    
    // Generate on load if there's a hash
    if (location.hash) { input.value = decodeURIComponent(location.hash.slice(1)); generateQR(); }
  </script>
</body>
</html>
