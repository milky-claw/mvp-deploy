<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTTP Headers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: #fff; }
    .input-group { display: flex; gap: 10px; margin-bottom: 1.5rem; }
    input { flex: 1; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 1rem; }
    button { padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }
    .result { background: #1a1a1a; border-radius: 8px; overflow: hidden; }
    .status { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #333; }
    .status.ok { color: #10b981; }
    .status.err { color: #ef4444; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 16px; text-align: left; border-bottom: 1px solid #252525; font-size: 0.875rem; }
    th { color: #888; font-weight: 500; width: 200px; }
    td { font-family: monospace; word-break: break-all; color: #ddd; }
    .loading { text-align: center; padding: 2rem; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 HTTP Headers Viewer</h1>
    <div class="input-group">
      <input type="url" id="url" placeholder="https://example.com" value="https://">
      <button onclick="fetchHeaders()">Fetch</button>
    </div>
    <div class="result" id="result"></div>
  </div>
  <script>
    async function fetchHeaders() {
      const url = document.getElementById('url').value.trim();
      const result = document.getElementById('result');
      
      if (!url) return;
      result.innerHTML = '<div class="loading">Fetching...</div>';
      
      try {
        const res = await fetch(url, { method: 'HEAD' });
        const statusEl = document.createElement('div');
        statusEl.className = 'status ' + (res.ok ? 'ok' : 'err');
        statusEl.textContent = `Status: ${res.status} ${res.statusText}`;
        
        const table = document.createElement('table');
        for (const [key, val] of res.headers) {
          const row = table.insertRow();
          row.innerHTML = `<th>${key}</th><td>${val}</td>`;
        }
        
        result.innerHTML = '';
        result.appendChild(statusEl);
        result.appendChild(table);
      } catch (e) {
        result.innerHTML = `<div class="status err">Error: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
