<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter & Validator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; color: #00d9ff; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    button:hover { transform: translateY(-2px); }
    .btn-primary { background: #00d9ff; color: #1a1a2e; }
    .btn-secondary { background: #4a4a6a; color: #fff; }
    .btn-success { background: #00ff88; color: #1a1a2e; }
    textarea { width: 100%; height: 400px; background: #16213e; border: 2px solid #4a4a6a; border-radius: 8px; color: #00ff88; font-family: 'Monaco', 'Menlo', monospace; font-size: 14px; padding: 15px; resize: vertical; }
    textarea:focus { outline: none; border-color: #00d9ff; }
    .status { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; }
    .status.error { background: #ff4757; color: white; display: block; }
    .status.success { background: #00ff88; color: #1a1a2e; display: block; }
    .stats { display: flex; gap: 20px; margin-top: 15px; color: #888; }
    .stat { background: #16213e; padding: 10px 15px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JSON Formatter & Validator</h1>
    
    <div class="toolbar">
      <button class="btn-primary" onclick="formatJSON()">Format</button>
      <button class="btn-secondary" onclick="minifyJSON()">Minify</button>
      <button class="btn-secondary" onclick="validateJSON()">Validate</button>
      <button class="btn-success" onclick="copyJSON()">Copy</button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
    </div>
    
    <textarea id="input" placeholder="Paste your JSON here..."></textarea>
    
    <div id="status" class="status"></div>
    
    <div class="stats">
      <div class="stat">Keys: <span id="keyCount">0</span></div>
      <div class="stat">Size: <span id="size">0</span> bytes</div>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const status = document.getElementById('status');
    const keyCount = document.getElementById('keyCount');
    const size = document.getElementById('size');

    function countKeys(obj, count = 0) {
      if (obj && typeof obj === 'object') {
        count += Object.keys(obj).length;
        for (const key in obj) {
          count = countKeys(obj[key], count);
        }
      }
      return count;
    }

    function updateStats() {
      try {
        const obj = JSON.parse(input.value);
        keyCount.textContent = countKeys(obj);
      } catch {
        keyCount.textContent = '0';
      }
      size.textContent = new Blob([input.value]).size;
    }

    function showStatus(msg, isError = false) {
      status.textContent = msg;
      status.className = 'status ' + (isError ? 'error' : 'success');
      setTimeout(() => { status.className = 'status'; }, 3000);
    }

    function formatJSON() {
      try {
        const obj = JSON.parse(input.value);
        input.value = JSON.stringify(obj, null, 2);
        updateStats();
        showStatus('JSON formatted!');
      } catch (e) {
        showStatus('Invalid JSON: ' + e.message, true);
      }
    }

    function minifyJSON() {
      try {
        const obj = JSON.parse(input.value);
        input.value = JSON.stringify(obj);
        updateStats();
        showStatus('JSON minified!');
      } catch (e) {
        showStatus('Invalid JSON: ' + e.message, true);
      }
    }

    function validateJSON() {
      try {
        JSON.parse(input.value);
        showStatus('Valid JSON ✓');
      } catch (e) {
        showStatus('Invalid JSON: ' + e.message, true);
      }
    }

    function copyJSON() {
      navigator.clipboard.writeText(input.value).then(() => {
        showStatus('Copied to clipboard!');
      });
    }

    function clearAll() {
      input.value = '';
      status.className = 'status';
      updateStats();
    }

    input.addEventListener('input', updateStats);
  </script>
</body>
</html>
