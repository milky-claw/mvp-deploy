<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Time Estimator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: #1e293b; padding: 2rem; border-radius: 16px; width: 100%; max-width: 600px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #f472b6; text-align: center; }
    .input-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: #94a3b8; }
    textarea { width: 100%; height: 200px; padding: 0.75rem; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1rem; resize: vertical; }
    textarea:focus { outline: none; border-color: #f472b6; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: #0f172a; padding: 1rem; border-radius: 8px; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: #f472b6; }
    .stat-label { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }
    .result { margin: 1.5rem 0; padding: 1.5rem; background: linear-gradient(135deg, #f472b6, #c084fc); border-radius: 12px; text-align: center; }
    .result-value { font-size: 2.5rem; font-weight: 700; color: #fff; }
    .result-label { font-size: 1rem; color: rgba(255,255,255,0.9); }
    .settings { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .setting-field { flex: 1; min-width: 120px; }
    .setting-field label { font-size: 0.75rem; }
    input[type="number"] { width: 100%; padding: 0.5rem; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #e2e8f0; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📖 Reading Time Estimator</h1>
    <div class="input-group">
      <label>Paste your text below</label>
      <textarea id="text" placeholder="Paste article, post, or any text to estimate reading time...">The quick brown fox jumps over the lazy dog. This is a sample paragraph to demonstrate the reading time calculator. It helps you estimate how long it will take someone to read through your content.

You can adjust the reading speed below based on your target audience. Average reading speed is around 200-250 words per minute for adults reading silently.</textarea>
    </div>
    <div class="settings">
      <div class="setting-field">
        <label>Words per minute</label>
        <input type="number" id="wpm" value="225" min="50" max="500">
      </div>
      <div class="setting-field">
        <label>Speaking rate (wpm)</label>
        <input type="number" id="speakingWpm" value="130" min="50" max="300">
      </div>
    </div>
    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="wordCount">0</div>
        <div class="stat-label">Words</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="charCount">0</div>
        <div class="stat-label">Characters</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="paraCount">0</div>
        <div class="stat-label">Paragraphs</div>
      </div>
    </div>
    <div class="result">
      <div class="result-value" id="readTime">~1 min</div>
      <div class="result-label">reading time</div>
    </div>
  </div>
  <script>
    const textEl = document.getElementById('text');
    const wpmEl = document.getElementById('wpm');
    
    function countWords(text) {
      return text.trim() ? text.trim().split(/\s+/).length : 0;
    }

    function calculate() {
      const text = textEl.value;
      const words = countWords(text);
      const chars = text.length;
      const paras = text.trim() ? text.split(/\n\s*\n/).filter(p => p.trim()).length : 0;
      const wpm = parseInt(wpmEl.value) || 225;
      
      const minutes = words / wpm;
      let readTime;
      if (minutes < 1) {
        readTime = '< 1 min';
      } else if (Math.round(minutes) === 1) {
        readTime = '~1 min';
      } else {
        readTime = `~${Math.round(minutes)} min`;
      }
      
      document.getElementById('wordCount').textContent = words;
      document.getElementById('charCount').textContent = chars;
      document.getElementById('paraCount').textContent = paras;
      document.getElementById('readTime').textContent = readTime;
    }

    textEl.addEventListener('input', calculate);
    wpmEl.addEventListener('input', calculate);
    calculate();
  </script>
</body>
</html>
