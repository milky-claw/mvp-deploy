<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Analyzer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 2rem; color: #00ff88; }
        .panel { background: #16213e; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.9rem; }
        textarea { width: 100%; height: 120px; background: #0f0f23; border: 1px solid #333; border-radius: 8px; color: #fff; padding: 1rem; font-size: 1rem; resize: vertical; }
        textarea:focus { outline: none; border-color: #00ff88; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-box { background: #0f0f23; border-radius: 8px; padding: 1rem; text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #00ff88; }
        .stat-label { font-size: 0.8rem; color: #888; margin-top: 0.25rem; }
        .words-table { width: 100%; border-collapse: collapse; }
        .words-table th, .words-table td { padding: 0.5rem 1rem; text-align: left; border-bottom: 1px solid #333; }
        .words-table th { color: #888; font-weight: normal; font-size: 0.85rem; }
        .words-table tr:hover { background: #1a1a2e; }
        .count-col { color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Text Analyzer</h1>
        <div class="panel">
            <label>Input Text</label>
            <textarea id="input" placeholder="Paste or type text to analyze..." oninput="analyze()"></textarea>
        </div>
        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="chars">0</div>
                <div class="stat-label">Characters</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="charsNoSpace">0</div>
                <div class="stat-label">Chars (no spaces)</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="words">0</div>
                <div class="stat-label">Words</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="lines">0</div>
                <div class="stat-label">Lines</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="paragraphs">0</div>
                <div class="stat-label">Paragraphs</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="readingTime">0</div>
                <div class="stat-label">Reading Time (min)</div>
            </div>
        </div>
        <div class="panel">
            <label>Word Frequency (Top 20)</label>
            <table class="words-table">
                <thead><tr><th>Word</th><th>Count</th></tr></thead>
                <tbody id="wordFreq"></tbody>
            </table>
        </div>
    </div>
    <script>
        function analyze() {
            const text = document.getElementById('input').value;
            
            // Basic stats
            document.getElementById('chars').textContent = text.length;
            document.getElementById('charsNoSpace').textContent = text.replace(/\s/g, '').length;
            
            const words = text.trim() ? text.trim().split(/\s+/) : [];
            document.getElementById('words').textContent = words.length;
            
            const lines = text ? text.split('\n').length : 0;
            document.getElementById('lines').textContent = lines;
            
            const paragraphs = text.trim() ? text.split(/\n\s*\n/).filter(p => p.trim()).length : 0;
            document.getElementById('paragraphs').textContent = paragraphs;
            
            // Reading time: ~200 wpm
            document.getElementById('readingTime').textContent = Math.ceil(words.length / 200);
            
            // Word frequency
            const freq = {};
            words.forEach(w => {
                const cleaned = w.toLowerCase().replace(/[^\w]/g, '');
                if (cleaned) freq[cleaned] = (freq[cleaned] || 0) + 1;
            });
            
            const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 20);
            document.getElementById('wordFreq').innerHTML = sorted.map(([w, c]) => 
                `<tr><td>${w}</td><td class="count-col">${c}</td></tr>`
            ).join('');
        }
        analyze();
    </script>
</body>
</html>
