<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Encoder / Decoder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1e1e2e; color: #eee; min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; color: #f9a8ff; }
    .section { margin-bottom: 25px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #cba6f7; }
    textarea, input { width: 100%; background: #313244; border: 2px solid #45475a; border-radius: 8px; color: #cdd6f4; font-family: 'Monaco', 'Menlo', monospace; font-size: 14px; padding: 12px; }
    textarea { height: 120px; resize: vertical; }
    input { height: 45px; }
    textarea:focus, input:focus { outline: none; border-color: #cba6f7; }
    .row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    button:hover { transform: translateY(-2px); }
    .btn-encode { background: #f9a8ff; color: #1e1e2e; }
    .btn-decode { background: #89dceb; color: #1e1e2e; }
    .btn-copy { background: #a6e3a1; color: #1e1e2e; }
    .btn-clear { background: #45475a; color: #cdd6f4; }
    .btn-swap { background: #f9e2af; color: #1e1e2e; }
    .divider { height: 2px; background: linear-gradient(90deg, transparent, #45475a, transparent); margin: 30px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 URL Encoder / Decoder</h1>
    
    <div class="section">
      <label>Plain Text</label>
      <textarea id="plain" placeholder="Enter text to encode/decode..."></textarea>
      <div class="row" style="margin-top: 10px">
        <button class="btn-encode" onclick="encodeURL()">Encode →</button>
        <button class="btn-decode" onclick="decodeURL()">← Decode</button>
        <button class="btn-copy" onclick="copy('plain')">Copy</button>
        <button class="btn-clear" onclick="clearField('plain')">Clear</button>
      </div>
    </div>
    
    <div class="divider"></div>
    
    <div class="section">
      <label>Encoded URL</label>
      <textarea id="encoded" placeholder="Enter URL-encoded text..."></textarea>
      <div class="row" style="margin-top: 10px">
        <button class="btn-encode" onclick="copy('encoded')">Copy</button>
        <button class="btn-clear" onclick="clearField('encoded')">Clear</button>
        <button class="btn-swap" onclick="swapFields()">⇅ Swap</button>
      </div>
    </div>
  </div>

  <script>
    const plain = document.getElementById('plain');
    const encoded = document.getElementById('encoded');

    function encodeURL() {
      try {
        encoded.value = encodeURIComponent(plain.value);
      } catch (e) {
        encoded.value = 'Error: ' + e.message;
      }
    }

    function decodeURL() {
      try {
        plain.value = decodeURIComponent(encoded.value);
      } catch (e) {
        plain.value = 'Error: Invalid encoding';
      }
    }

    function copy(field) {
      const value = document.getElementById(field).value;
      navigator.clipboard.writeText(value);
    }

    function clearField(field) {
      document.getElementById(field).value = '';
    }

    function swapFields() {
      const temp = plain.value;
      plain.value = encoded.value;
      encoded.value = temp;
    }
  </script>
</body>
</html>
