<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: #1a1a2e; border-radius: 16px; padding: 40px; max-width: 580px; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    h1 { color: #4fd1c5; font-size: 1.8rem; margin-bottom: 8px; }
    .subtitle { color: #888; margin-bottom: 24px; font-size: 0.9rem; }
    textarea { width: 100%; height: 180px; padding: 16px; border: 2px solid #2d3748; border-radius: 12px; background: #171717; color: #fff; font-size: 1rem; resize: vertical; margin-bottom: 20px; }
    textarea:focus { outline: none; border-color: #4fd1c5; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { background: #232338; padding: 16px; border-radius: 10px; text-align: center; }
    .stat-num { font-size: 1.8rem; font-weight: 700; color: #4fd1c5; }
    .stat-label { font-size: 0.75rem; color: #888; margin-top: 4px; text-transform: uppercase; }
    .clear-btn { background: #e53e3e; margin-top: 20px; }
    .clear-btn:hover { background: #c53030; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Word Counter</h1>
    <p class="subtitle">Count words, characters, lines and paragraphs instantly</p>
    <textarea id="text" placeholder="Paste or type your text here..."></textarea>
    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="words">0</div>
        <div class="stat-label">Words</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="chars">0</div>
        <div class="stat-label">Characters</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="lines">0</div>
        <div class="stat-label">Lines</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="paragraphs">0</div>
        <div class="stat-label">Paragraphs</div>
      </div>
    </div>
    <button class="btn clear-btn" onclick="clearText()">Clear Text</button>
  </div>
  
  <script>
    const textarea = document.getElementById('text');
    
    function count() {
      const text = textarea.value;
      
      // Words (split by whitespace, filter empty)
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      
      // Characters
      const chars = text.length;
      
      // Lines
      const lines = text ? text.split('\n').length : 0;
      
      // Paragraphs (split by double newlines)
      const paragraphs = text.trim() ? text.split(/\n\s*\n/).filter(p => p.trim()).length : 0;
      
      document.getElementById('words').textContent = words;
      document.getElementById('chars').textContent = chars;
      document.getElementById('lines').textContent = lines;
      document.getElementById('paragraphs').textContent = paragraphs;
    }
    
    function clearText() {
      textarea.value = '';
      count();
    }
    
    textarea.addEventListener('input', count);
    textarea.addEventListener('paste', () => setTimeout(count, 10));
  </script>
</body>
</html>
