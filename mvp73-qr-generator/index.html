<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: #0f0f23; border-radius: 16px; padding: 40px; max-width: 480px; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    h1 { color: #e94560; font-size: 1.8rem; margin-bottom: 8px; }
    .subtitle { color: #888; margin-bottom: 24px; font-size: 0.9rem; }
    textarea { width: 100%; height: 100px; padding: 12px; border: 2px solid #2a2a4a; border-radius: 8px; background: #1a1a2e; color: #fff; font-size: 1rem; resize: none; margin-bottom: 16px; }
    textarea:focus { outline: none; border-color: #e94560; }
    .btn { background: #e94560; color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 100%; font-weight: 600; transition: all 0.2s; }
    .btn:hover { background: #ff6b6b; transform: translateY(-2px); }
    #qrcode { margin-top: 24px; display: flex; justify-content: center; }
    #qrcode canvas { border-radius: 8px; background: #fff; padding: 16px; }
    .download-btn { background: #4ecca3; margin-top: 16px; display: none; }
    .download-btn:hover { background: #45b390; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ QR Code Generator</h1>
    <p class="subtitle">Generate QR codes instantly - no signup required</p>
    <textarea id="text" placeholder="Enter URL or text..."></textarea>
    <button class="btn" onclick="generateQR()">Generate QR Code</button>
    <div id="qrcode"></div>
    <button class="btn download-btn" id="downloadBtn" onclick="downloadQR()">Download PNG</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    let canvas;
    function generateQR() {
      const text = document.getElementById('text').value.trim();
      if (!text) return alert('Please enter some text!');
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      canvas = document.createElement('canvas');
      QRCode.toCanvas(canvas, text, { width: 200, margin: 2, color: { dark: '#000', light: '#fff' } });
      container.appendChild(canvas);
      document.getElementById('downloadBtn').style.display = 'block';
    }
    function downloadQR() {
      const link = document.createElement('a');
      link.download = 'qrcode.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
